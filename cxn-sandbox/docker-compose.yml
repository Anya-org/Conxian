version: '3.8'

services:
  # PostgreSQL Database
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-conxian}
      POSTGRES_USER: ${POSTGRES_USER:-conxian}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U conxian"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Redis Cache
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Conxian Nexus (Settlement Layer)
  nexus:
    build:
      context: ../conxian-nexus
      dockerfile: ../docker/nexus.Dockerfile
    ports:
      - "3001:3001"
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-conxian}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-conxian}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      STACKS_NETWORK: testnet
      RUST_LOG: info
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./config/nexus:/app/config

  # Conxian Gateway (ISO 20022 Bridge)
  gateway:
    build:
      context: ../conxian-gateway
      dockerfile: ../docker/gateway.Dockerfile
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-conxian}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-conxian}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      NEXUS_URL: http://nexus:3001
      BITCOIN_RPC_URL: ${BITCOIN_RPC_URL:-https://bitcoin-testnet.publicnode.com}
      STACKS_NETWORK: testnet
      RUST_LOG: info
      # Sandbox mode - no API key required
      SANDBOX_MODE: "true"
    depends_on:
      nexus:
        condition: service_started
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./config/gateway:/app/config

volumes:
  postgres_data:
  redis_data:
