name: Conxian UI CI

on:
  pull_request:
    paths:
      - 'ui/**'
  push:
    branches:
      - main
    paths:
      - 'ui/**'

permissions:
  contents: read

jobs:
  validate-ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ui/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint and Type Check
        run: |
          npm run lint
          npm run type-check

      - name: Build
        run: npm run build

      - name: Run Tests
        run: npm test
