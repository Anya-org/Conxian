name: Scheduled Protocol Health Check

on:
  schedule:
    # Run every Monday at 03:00 UTC
    - cron: '0 3 * * 1'
  workflow_dispatch:
    # Allow manual triggering

permissions:
  contents: read

jobs:
  full-test-suite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Clarinet
        run: |
          set -euo pipefail
          VERSION="v3.2.0"
          curl -sSL -o clarinet.tar.gz "https://github.com/hirosystems/clarinet/releases/download/${VERSION}/clarinet-linux-x64-glibc.tar.gz"
          tar -xzf clarinet.tar.gz clarinet
          chmod +x clarinet
          sudo mv clarinet /usr/local/bin/clarinet
          clarinet --version

      - name: Clarinet Check
        run: clarinet check --manifest-path Clarinet.toml

      - name: Run Full Test Suite
        run: npm run ci

      - name: Run Coverage
        run: npm run coverage

      - name: Upload Test Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-test-results
          path: |
            coverage/
            *.log
            npm-debug.log*
