name: Sovereign Guard

on:
  push:
    paths:
      - 'Conxian/**'
  pull_request:
    paths:
      - 'Conxian/**'

permissions:
  contents: read

jobs:
  jules-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Run Contamination Guard
        run: python scripts/verify_contamination_guard.py
