name: Sovereign Guard

on:
  push:
    paths:
      - 'Conxian/**'
  pull_request:
    paths:
      - 'Conxian/**'

permissions:
  contents: read

jobs:
  contamination-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.CI_SUBMODULES_PAT || github.token }}
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'
      - name: Run Contamination Guard
        run: python scripts/verify_contamination_guard.py
