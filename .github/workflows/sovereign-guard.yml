name: Sovereign Guard Audit
on:
  push:
    paths:
      - 'contracts/**'
      - 'deployments/**'
      - 'ui/**'
jobs:
  jules-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'
      - name: Run Contamination Guard
        run: python3 scripts/verify_contamination_guard.py
