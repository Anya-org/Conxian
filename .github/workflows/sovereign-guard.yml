name: Sovereign Guard Audit
on:
  push:
    paths:
      - 'contracts/**'
      - 'deployments/**'
      - 'ui/**'
  pull_request:
    paths:
      - 'contracts/**'
      - 'deployments/**'
      - 'ui/**'

permissions:
  contents: read

jobs:
  jules-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332
      - name: Set up Python
        uses: actions/setup-python@0b64b9adb5ac72b8cf53834bae40e359a9738965
        with:
          python-version: '3.10'
      - name: Run Contamination Guard
        run: python3 scripts/verify_contamination_guard.py
