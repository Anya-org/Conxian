name: Sovereign Guard

on:
  push:
    paths:
      - 'Conxian/**'
  pull_request:
    paths:
      - 'Conxian/**'

permissions:
  contents: read

jobs:
  contamination-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # ratchet:actions/checkout@v6
        with:
          submodules: recursive
          token: ${{ secrets.CI_SUBMODULES_PAT || github.token }}
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Run Contamination Guard
        run: python scripts/verify_contamination_guard.py
