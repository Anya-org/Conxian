name: Conxian Unified CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repo-hygiene:
    name: Repo Hygiene (ZSE & Submodules)
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
      with:
        submodules: recursive
        token: ${{ secrets.CI_SUBMODULES_PAT || github.token }}
        persist-credentials: false
    - name: Setup Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.10'
    - name: Verify knowledge retention (ZSE)
      run: |
        python3 scripts/verify_knowledge_retention.py
    - name: Verify submodule integrity
      run: |
        python3 scripts/verify_submodule_integrity.py
        git submodule status --recursive

  gateway-suite:
    name: Gateway Suite
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'push' ||
      (
        github.event_name == 'pull_request' &&
        github.event.pull_request.head.repo.full_name == github.repository
      )
    steps:
    - uses: actions/checkout@v6
      with:
        submodules: recursive
        token: ${{ secrets.CI_SUBMODULES_PAT || github.token }}
        persist-credentials: false
    - name: Setup Rust
      uses: dtolnay/rust-toolchain@stable
    - name: Rust Cache
      uses: Swatinem/rust-cache@v2
      with:
        workspaces: conxian-gateway
    - name: Check & Test
      run: |
        cd conxian-gateway
        cargo check -p api
        cargo test

  b2b-suite:
    name: B2B Suite (Nexus & SDK)
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'push' ||
      (
        github.event_name == 'pull_request' &&
        github.event.pull_request.head.repo.full_name == github.repository
      )
    steps:
    - uses: actions/checkout@v6
      with:
        submodules: recursive
        token: ${{ secrets.CI_SUBMODULES_PAT || github.token }}
        persist-credentials: false
    - name: Setup Rust
      uses: dtolnay/rust-toolchain@stable
    - name: Rust Cache
      uses: Swatinem/rust-cache@v2
      with:
        workspaces: |
          conxian-nexus
          lib-conclave-sdk
    - name: Check & Test
      run: |
        cd conxian-nexus
        cargo test

  lib-conxian-core-suite:
    name: Core Library Suite (lib-conxian-core)
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'push' ||
      (
        github.event_name == 'pull_request' &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        contains(github.event.pull_request.labels.*.name, 'b2b')
      )
    steps:
    - uses: actions/checkout@v6
      with:
        submodules: recursive
        token: ${{ secrets.CI_SUBMODULES_PAT || github.token }}
        persist-credentials: false
    - name: Setup Rust
      uses: dtolnay/rust-toolchain@stable
    - name: Rust Cache
      uses: Swatinem/rust-cache@v2
      with:
        workspaces: lib-conxian-core
    - name: Check & Test
      run: |
        cd lib-conxian-core
        cargo test --locked
        cargo clippy --all-targets --all-features -- -D warnings
    - name: Dependency audit
      run: |
        cargo install cargo-audit --version 0.22.1 --locked
        cd lib-conxian-core
        cargo audit

  b2c-wallet-suite:
    name: B2C Wallet Suite
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'push' ||
      (
        github.event_name == 'pull_request' &&
        github.event.pull_request.head.repo.full_name == github.repository
      )
    steps:
    - uses: actions/checkout@v6
      with:
        submodules: recursive
        token: ${{ secrets.CI_SUBMODULES_PAT || github.token }}
        persist-credentials: false
    - name: Setup Node.js
      uses: actions/setup-node@v6
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: conxius-wallet/package-lock.json
    - name: Install & Test
      run: |
        cd conxius-wallet
        npm ci
        npm test

    - name: Upload test artifacts
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: conxius-wallet-test-artifacts
        path: |
          conxius-wallet/test-results
          conxius-wallet/playwright-report
          conxius-wallet/blob-report
        if-no-files-found: ignore
        retention-days: 7

    - name: Upload coverage
      if: github.event_name == 'push' && hashFiles('conxius-wallet/coverage/**') != ''
      uses: actions/upload-artifact@v4
      with:
        name: conxius-wallet-coverage
        path: conxius-wallet/coverage
        if-no-files-found: ignore
        retention-days: 7

  audit-and-docs:
    name: Transparency Audit & Docs
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      contains(github.event.pull_request.labels.*.name, 'audit')
    steps:
    - uses: actions/checkout@v6
      with:
        submodules: recursive
        token: ${{ secrets.CI_SUBMODULES_PAT || github.token }}
        persist-credentials: false
    - name: Setup Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.10'
    - name: Run Audit
      run: |
        python3 conxian-business/transparency_custodian.py
    - name: Validate Summary
      run: |
        grep -oP '(?<=\]\().*?\.md(?=\))' SUMMARY.md | while read -r link; do
          if [ ! -f "$link" ]; then
            echo "ERROR: Broken link in SUMMARY.md -> $link"
            false
          fi
        done

  testnet-simulation:
    name: Testnet Simulation
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      contains(github.event.pull_request.labels.*.name, 'simulation')
    steps:
    - uses: actions/checkout@v6
      with:
        submodules: recursive
        token: ${{ secrets.CI_SUBMODULES_PAT || github.token }}
        persist-credentials: false
    - name: Setup Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.10'
    - name: Install & Simulate
      run: |
        pip install -r stacksorbit/requirements.txt
        python3 stacksorbit/conxian_testnet_deploy.py --help
