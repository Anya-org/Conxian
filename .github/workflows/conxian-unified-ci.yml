name: Conxian Unified CI

on:
  push:
    branches: [ main, staged, dev ]
  pull_request:
    branches: [ main, staged, dev ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  change_detection:
    name: Detect CI suite triggers
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      b2b: ${{ (github.event_name == 'push' && steps.filter_push.outputs.b2b) || (github.event_name == 'pull_request' && steps.classify_pr.outputs.b2b) || 'false' }}
      docs_only: ${{ (github.event_name == 'push' && steps.filter_push.outputs.docs_only) || (github.event_name == 'pull_request' && steps.classify_pr.outputs.docs_only) || 'false' }}
      code_impacting: ${{ (github.event_name == 'push' && steps.filter_push.outputs.code_impacting) || (github.event_name == 'pull_request' && steps.classify_pr.outputs.code_impacting) || 'true' }}
    steps:
    - name: Classify PR change scope
      if: github.event_name == 'pull_request'
      id: classify_pr
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # ratchet:actions/github-script@v9.0.0
      with:
        script: |
          const pr = context.payload.pull_request;
          if (!pr) {
            core.setOutput('b2b', 'false');
            core.setOutput('docs_only', 'false');
            core.setOutput('code_impacting', 'true');
            return;
          }

          const changedFiles = await github.paginate(github.rest.pulls.listFiles, {
            owner: context.repo.owner,
            repo: context.repo.repo,
            pull_number: pr.number,
            per_page: 100,
          });

          const paths = changedFiles.map((file) => file.filename);

          const isDocsOnlyPath = (path) => (
            path.startsWith('docs/') ||
            path.endsWith('.md') ||
            path.endsWith('.rst') ||
            path === 'SUMMARY.md' ||
            path === 'CHANGELOG.md' ||
            (path.startsWith('.github/') && path.endsWith('.md'))
          );

          const codeImpacting = paths.some((path) => !isDocsOnlyPath(path));
          const docsOnly = !codeImpacting;
          const b2b = paths.some((path) => (
            path === 'conxian-nexus' ||
            path.startsWith('conxian-nexus/') ||
            path === 'conxius-enclave-sdk' ||
            path.startsWith('conxius-enclave-sdk/') ||
            path === '.gitmodules'
          ));

          core.setOutput('b2b', b2b ? 'true' : 'false');
          core.setOutput('docs_only', docsOnly ? 'true' : 'false');
          core.setOutput('code_impacting', codeImpacting ? 'true' : 'false');

          core.info(`Detected ${paths.length} changed files for PR #${pr.number}.`);
          core.info(`b2b=${b2b}, docs_only=${docsOnly}, code_impacting=${codeImpacting}`);

    - name: Default push classification
      if: github.event_name == 'push'
      id: filter_push
      run: |
        echo "b2b=true" >> $GITHUB_OUTPUT
        echo "docs_only=false" >> $GITHUB_OUTPUT
        echo "code_impacting=true" >> $GITHUB_OUTPUT

  repo-hygiene:
    name: Repo Hygiene (ZSE & Submodules)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # ratchet:actions/checkout@v6
      with:
        submodules: recursive
        token: ${{ secrets.CI_SUBMODULES_PAT || github.token }}
        persist-credentials: false
    - name: Ensure submodules are initialized
      run: |
        git submodule sync --recursive
        git submodule update --init
        git -c submodule.conxius-platform.update=checkout submodule update --init conxius-platform
    - name: Setup Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.11'
    - name: Install Python dependency for LTS check
      run: |
        python3 -m pip install --disable-pip-version-check packaging
    - name: Verify knowledge retention (ZSE)
      if: ${{ hashFiles('scripts/verify_knowledge_retention.py') != '' }}
      run: |
        python3 scripts/verify_knowledge_retention.py
    - name: Verify tracked artifacts
      if: ${{ hashFiles('scripts/verify_tracked_artifacts.py') != '' }}
      run: |
        python3 scripts/verify_tracked_artifacts.py
    - name: Verify compose env templates
      if: ${{ hashFiles('scripts/verify_compose_env_templates.py') != '' }}
      run: |
        python3 scripts/verify_compose_env_templates.py
    - name: Verify submodule secret filename hygiene (all)
      if: ${{ hashFiles('scripts/verify_submodule_secret_filenames.py') != '' }}
      run: |
        python3 scripts/verify_submodule_secret_filenames.py --all
    - name: Verify BOS production boundary
      if: ${{ hashFiles('scripts/verify_bos_production_boundary.py') != '' }}
      run: |
        python3 scripts/verify_bos_production_boundary.py
    - name: Verify submodule integrity and update policy
      if: ${{ hashFiles('scripts/verify_submodule_integrity.py') != '' }}
      run: |
        python3 scripts/verify_submodule_integrity.py
        git submodule status --recursive
    - name: Verify release hygiene (tags + changelog + README sync)
      if: ${{ hashFiles('scripts/verify_release_hygiene.py') != '' }}
      env:
        GITHUB_TOKEN: ${{ github.token }}
        VERIFY_RELEASE_HYGIENE_CHECK_ORIGIN_TAGS: 'true'
        VERIFY_RELEASE_HYGIENE_TAG_EXPECTATION_MODE: 'require'
      run: |
        python3 scripts/verify_release_hygiene.py
    - name: Verify docs public-safe preflight
      if: ${{ hashFiles('scripts/build_pages_artifact_public_safe.sh') != '' }}
      run: |
        bash scripts/build_pages_artifact_public_safe.sh _pages_preflight
    - name: Verify governance baseline
      env:
        BOS_REQUIRE_PORTFOLIO_DOCS: 'true'
      run: |
        python3 scripts/verify_repo_governance_baseline.py
    - name: Verify LTS compliance
      if: ${{ hashFiles('scripts/verify_lts_compliance.py') != '' }}
      run: |
        python3 scripts/verify_lts_compliance.py
    - name: Verify wallet lifecycle control gates
      run: |
        python3 scripts/verify_wallet_lifecycle_control_gates.py
    - name: Verify production contamination guard
      if: ${{ hashFiles('scripts/verify_contamination_guard.py') != '' }}
      run: |
        python3 scripts/verify_contamination_guard.py
    - name: Enforce BOS PR classification
      if: ${{ github.event_name == 'pull_request' && hashFiles('scripts/verify_pr_bos_classification.py') != '' }}
      run: |
        python3 scripts/verify_pr_bos_classification.py

  gateway-suite:
    name: Gateway Suite
    runs-on: ubuntu-latest
    needs: [change_detection]
    if: >-
      github.event_name == 'push' ||
      (
        github.event_name == 'pull_request' &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        needs.change_detection.outputs.docs_only != 'true'
      )
    steps:
    - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # ratchet:actions/checkout@v6
      with:
        submodules: recursive
        token: ${{ secrets.CI_SUBMODULES_PAT || github.token }}
        persist-credentials: false
    - name: Setup Rust
      uses: dtolnay/rust-toolchain@v1
      with:
        toolchain: stable
    - name: Rust Cache
      uses: Swatinem/rust-cache@v2
      with:
        workspaces: conxian-gateway
    - name: Check & Test
      run: |
        cd conxian-gateway
        cargo check -p api
        cargo test

  b2b-suite:
    name: B2B Suite (Nexus & SDK)
    runs-on: ubuntu-latest
    needs: [change_detection]
    if: >-
      github.event_name == 'push' ||
      (
        github.event_name == 'pull_request' &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        needs.change_detection.outputs.docs_only != 'true' &&
        (
          needs.change_detection.outputs.b2b == 'true' ||
          contains(github.event.pull_request.labels.*.name, 'b2b')
        )
      )
    steps:
    - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # ratchet:actions/checkout@v6
      with:
        submodules: recursive
        token: ${{ secrets.CI_SUBMODULES_PAT || github.token }}
        persist-credentials: false
    - name: Setup Rust
      uses: dtolnay/rust-toolchain@v1
      with:
        toolchain: stable
    - name: Rust Cache
      uses: Swatinem/rust-cache@v2
      with:
        workspaces: |
          conxian-nexus
    - name: Check & Test
      run: |
        cd conxian-nexus
        cargo test

  lib-conxian-core-suite:
    name: Core Library Suite (lib-conxian-core)
    runs-on: ubuntu-latest
    needs: [change_detection]
    if: >-
      github.event_name == 'push' ||
      (
        github.event_name == 'pull_request' &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        needs.change_detection.outputs.docs_only != 'true'
      )
    steps:
    - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # ratchet:actions/checkout@v6
      with:
        submodules: recursive
        token: ${{ secrets.CI_SUBMODULES_PAT || github.token }}
        persist-credentials: false
    - name: Setup Rust
      uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      with:
        components: clippy
    - name: Rust Cache
      uses: Swatinem/rust-cache@v2
      with:
        workspaces: lib-conxian-core
    - name: Check & Test
      run: |
        cd lib-conxian-core
        cargo test --locked
        cargo clippy --locked --all-targets --all-features -- -D warnings
    - name: Install cargo-audit
      uses: taiki-e/install-action@4684b8405694ae9dd42c9f39ba901a70ae83f4a3 # v2
      with:
        tool: cargo-audit@0.22.1
    - name: Dependency audit
      run: |
        cd lib-conxian-core
        # Temporary, narrow advisory allowlist:
        # rustls-webpki 0.101.7 is pulled transitively via bdk -> electrum-client.
        # lib-conxian-core currently tracks upstream bdk/electrum-client versions,
        # and a safe local upgrade path is not available in this repo without
        # broader dependency migration.
        cargo audit \
          --ignore RUSTSEC-2026-0098 \
          --ignore RUSTSEC-2026-0099 \
          --ignore RUSTSEC-2026-0104 \
          --ignore RUSTSEC-2026-0204 \
          --ignore RUSTSEC-2024-0388

  b2c-wallet-suite:
    name: B2C Wallet Suite
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [change_detection]
    if: >-
      github.event_name == 'push' ||
      (
        github.event_name == 'pull_request' &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        needs.change_detection.outputs.docs_only != 'true'
      )
    steps:
    - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # ratchet:actions/checkout@v6
      with:
        submodules: recursive
        token: ${{ secrets.CI_SUBMODULES_PAT || github.token }}
        persist-credentials: false
    - name: Setup pnpm
      uses: pnpm/action-setup@v6
      with:
        version: 9.15.9
        run_install: false
    - name: Setup Node.js
      uses: actions/setup-node@v6
      with:
        node-version: '20'
        package-manager-cache: false
        # conxius-wallet is pnpm-lockfile-first; keep cache/install aligned to pnpm lockfile.
        cache: 'pnpm'
        cache-dependency-path: conxius-wallet/pnpm-lock.yaml
    - name: Verify pinned pnpm
      run: |
        PNPM_VERSION="$(pnpm --version)"
        if [ "$PNPM_VERSION" != "9.15.9" ]; then
          echo "Expected pnpm 9.15.9, got $PNPM_VERSION"
          exit 1
        fi
    - name: Install & Test
      run: |
        cd conxius-wallet
        pnpm install --frozen-lockfile --ignore-workspace
        pnpm test -- --reporter=verbose

    - name: Upload test artifacts
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: conxius-wallet-test-artifacts
        path: |
          conxius-wallet/test-results
          conxius-wallet/playwright-report
          conxius-wallet/blob-report
        if-no-files-found: ignore
        retention-days: 7

    - name: Upload coverage
      if: github.event_name == 'push' && hashFiles('conxius-wallet/coverage/**') != ''
      uses: actions/upload-artifact@v7
      with:
        name: conxius-wallet-coverage
        path: conxius-wallet/coverage
        if-no-files-found: ignore
        retention-days: 7

  audit-and-docs:
    name: Transparency Audit & Docs
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      contains(github.event.pull_request.labels.*.name, 'audit')
    steps:
    - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # ratchet:actions/checkout@v6
      with:
        submodules: recursive
        token: ${{ secrets.CI_SUBMODULES_PAT || github.token }}
        persist-credentials: false
    - name: Setup Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.11'
    - name: Run Audit
      run: |
        python3 conxian-business/transparency_custodian.py
    - name: Validate Summary
      run: |
        grep -oP '(?<=\]\().*?\.md(?=\))' SUMMARY.md | while read -r link; do
          if [ ! -f "$link" ]; then
            echo "ERROR: Broken link in SUMMARY.md -> $link"
            false
          fi
        done

  testnet-simulation:
    name: Testnet Simulation
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      contains(github.event.pull_request.labels.*.name, 'simulation')
    steps:
    - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # ratchet:actions/checkout@v6
      with:
        submodules: recursive
        token: ${{ secrets.CI_SUBMODULES_PAT || github.token }}
        persist-credentials: false
    - name: Setup Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.11'
    - name: Install & Simulate
      run: |
        pip install -r conxius-orbit/requirements.txt
        python3 conxius-orbit/conxian_testnet_deploy.py --help

  ci-summary:
    name: CI Summary Gate
    runs-on: ubuntu-latest
    if: always()
    needs:
      - change_detection
      - repo-hygiene
      - gateway-suite
      - b2b-suite
      - lib-conxian-core-suite
      - b2c-wallet-suite
      - audit-and-docs
      - testnet-simulation
    steps:
    - name: Summarize results and enforce repo-content gate
      env:
        CHANGE_DETECTION_RESULT: ${{ needs.change_detection.result }}
        DOCS_ONLY: ${{ needs.change_detection.outputs.docs_only }}
        CODE_IMPACTING: ${{ needs.change_detection.outputs.code_impacting }}
        B2B_TRIGGER: ${{ needs.change_detection.outputs.b2b }}
        REPO_HYGIENE_RESULT: ${{ needs.repo-hygiene.result }}
        GATEWAY_SUITE_RESULT: ${{ needs.gateway-suite.result }}
        B2B_SUITE_RESULT: ${{ needs.b2b-suite.result }}
        LIB_CORE_SUITE_RESULT: ${{ needs.lib-conxian-core-suite.result }}
        B2C_WALLET_SUITE_RESULT: ${{ needs.b2c-wallet-suite.result }}
        AUDIT_DOCS_RESULT: ${{ needs.audit-and-docs.result }}
        TESTNET_SIMULATION_RESULT: ${{ needs.testnet-simulation.result }}
      run: |
        python3 - <<'PY'
        import os
        import sys

        docs_only = os.getenv('DOCS_ONLY', 'false').lower() == 'true'
        code_impacting = os.getenv('CODE_IMPACTING', 'true').lower() == 'true'
        b2b_trigger = os.getenv('B2B_TRIGGER', 'false').lower() == 'true'

        rows = [
            ('Change detection', os.getenv('CHANGE_DETECTION_RESULT', 'unknown'), False),
            ('Repo Hygiene (ZSE & Submodules)', os.getenv('REPO_HYGIENE_RESULT', 'unknown'), True),
            ('Gateway Suite', os.getenv('GATEWAY_SUITE_RESULT', 'unknown'), code_impacting),
            (
                'B2B Suite (Nexus & SDK)',
                os.getenv('B2B_SUITE_RESULT', 'unknown'),
                code_impacting and os.getenv('B2B_SUITE_RESULT', 'skipped') != 'skipped',
            ),
            (
                'Core Library Suite (lib-conxian-core)',
                os.getenv('LIB_CORE_SUITE_RESULT', 'unknown'),
                code_impacting,
            ),
            ('B2C Wallet Suite', os.getenv('B2C_WALLET_SUITE_RESULT', 'unknown'), code_impacting),
            ('Transparency Audit & Docs', os.getenv('AUDIT_DOCS_RESULT', 'unknown'), False),
            ('Testnet Simulation', os.getenv('TESTNET_SIMULATION_RESULT', 'unknown'), False),
        ]

        blocking_states = {'failure', 'cancelled', 'timed_out'}
        blocking_jobs = [
            name
            for name, result, required in rows
            if required and result in blocking_states
        ]

        with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as summary:
            summary.write('## Conxian Unified CI summary\n\n')
            summary.write(
                f"- PR classification: **{'docs-only' if docs_only else 'code-impacting'}**\n"
            )
            summary.write(f"- B2B trigger detected: **{'yes' if b2b_trigger else 'no'}**\n")
            if docs_only:
                summary.write(
                    '- Docs-only PR detected: heavy implementation suites are intentionally skipped.\n\n'
                )
            else:
                summary.write(
                    '- Code-impacting PR detected: core implementation suites are required for merge.\n\n'
                )

            summary.write('| Job | Result | Required for repo-content merge gate |\n')
            summary.write('| --- | --- | --- |\n')
            for name, result, required in rows:
                summary.write(
                    f"| {name} | `{result}` | {'yes' if required else 'no'} |\n"
                )

            if blocking_jobs:
                summary.write('\n### Merge gate result\n')
                summary.write('❌ **Fail** — required repo-content checks failed:\n')
                for job in blocking_jobs:
                    summary.write(f'- `{job}`\n')
            else:
                summary.write('\n### Merge gate result\n')
                summary.write('✅ **Pass** — no required repo-content check failures detected.\n')

        if blocking_jobs:
            print('Blocking repo-content check failures:', ', '.join(blocking_jobs))
            sys.exit(1)

        print('CI summary gate passed.')
        PY
