name: Verify Deployment Evidence

on:
  workflow_dispatch:
    inputs:
      network:
        description: 'Expected deployment network'
        type: choice
        required: true
        options:
          - testnet
          - mainnet
      deployer:
        description: 'Expected canonical deployer address'
        type: string
        required: true
      deployed_commit:
        description: 'Exact git commit that was deployed'
        type: string
        required: true
      plan_path:
        description: 'Exact network deployment plan path in the deployed commit'
        type: string
        required: true
      plan_sha256:
        description: 'SHA-256 of the exact deployment plan'
        type: string
        required: true
      evidence_manifest:
        description: 'Repository-relative evidence manifest path at the deployed commit'
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: verify-deployment-evidence-${{ inputs.network }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the explicitly deployed commit
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: ${{ inputs.deployed_commit }}

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Validate evidence binding inputs
        env:
          EXPECTED_NETWORK: ${{ inputs.network }}
          EXPECTED_DEPLOYER: ${{ inputs.deployer }}
          DEPLOYED_COMMIT: ${{ inputs.deployed_commit }}
          PLAN_PATH: ${{ inputs.plan_path }}
          PLAN_SHA256: ${{ inputs.plan_sha256 }}
          EVIDENCE_MANIFEST: ${{ inputs.evidence_manifest }}
        run: |
          set -euo pipefail
          ACTUAL_COMMIT=$(git rev-parse HEAD)
          if [[ "$ACTUAL_COMMIT" != "$DEPLOYED_COMMIT" ]]; then
            echo "::error::Checked out commit does not match the explicitly deployed commit."
            exit 1
          fi

          case "$EXPECTED_NETWORK" in
            testnet) EXPECTED_PLAN_PATH="deployments/full-system.testnet-plan.yaml" ;;
            mainnet) EXPECTED_PLAN_PATH="deployments/full-system.mainnet-plan.yaml" ;;
            *) echo "::error::Network must be testnet or mainnet."; exit 1 ;;
          esac
          if [[ "$PLAN_PATH" != "$EXPECTED_PLAN_PATH" ]]; then
            echo "::error::Plan path is not the canonical plan for the expected network."
            exit 1
          fi
          if [[ ! "$DEPLOYED_COMMIT" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "::error::deployed_commit must be a 40-character commit SHA."
            exit 1
          fi
          if [[ ! "$PLAN_SHA256" =~ ^[0-9a-fA-F]{64}$ ]]; then
            echo "::error::plan_sha256 must be a 64-character SHA-256 digest."
            exit 1
          fi
          if [[ ! "$EVIDENCE_MANIFEST" == deployment/evidence/*.json || "$EVIDENCE_MANIFEST" == *..* || "$EVIDENCE_MANIFEST" == *//* ]]; then
            echo "::error::Evidence manifest must be under deployment/evidence/."
            exit 1
          fi
          if [[ ! -f "$PLAN_PATH" || ! -f "$EVIDENCE_MANIFEST" ]]; then
            echo "::error::The exact plan and evidence manifest must exist at the deployed commit."
            exit 1
          fi
          ACTUAL_PLAN_SHA256=$(sha256sum "$PLAN_PATH" | awk '{print $1}')
          if [[ "${ACTUAL_PLAN_SHA256,,}" != "${PLAN_SHA256,,}" ]]; then
            echo "::error::Deployment plan SHA-256 does not match the explicitly bound digest."
            exit 1
          fi

      - name: Verify declared evidence entries against Hiro
        id: verify-evidence
        env:
          HIRO_API_KEY: ${{ secrets.HIRO_API_KEY }}
          EXPECTED_NETWORK: ${{ inputs.network }}
          EXPECTED_DEPLOYER: ${{ inputs.deployer }}
          DEPLOYED_COMMIT: ${{ inputs.deployed_commit }}
          PLAN_PATH: ${{ inputs.plan_path }}
          PLAN_SHA256: ${{ inputs.plan_sha256 }}
          EVIDENCE_MANIFEST: ${{ inputs.evidence_manifest }}
        run: |
          set -euo pipefail
          npx tsx scripts/verify-deployment-evidence.ts \
            --manifest "$EVIDENCE_MANIFEST" \
            --expected-network "$EXPECTED_NETWORK" \
            --expected-deployer "$EXPECTED_DEPLOYER" \
            --expected-git-commit "$DEPLOYED_COMMIT" \
            --expected-plan-path "$PLAN_PATH" \
            --expected-plan-sha256 "$PLAN_SHA256" \
            --output deployment-evidence-report.json

      - name: Report verification scope
        if: always()
        run: |
          node --input-type=module <<'NODE' >> "$GITHUB_STEP_SUMMARY"
          import { readFileSync } from "node:fs";

          console.log("## Deployment Evidence Verification");
          try {
            const report = JSON.parse(readFileSync("deployment-evidence-report.json", "utf8"));
            if (report.ok === true && report.claim === "declared evidence entries verified") {
              console.log("**Status:** declared evidence entries verified");
              console.log("**Coverage:** the verifier is intentionally scoped to declared evidence entries; complete plan coverage is not claimed.");
            } else {
              console.log("**Status:** no deployment is verified");
              console.log(`**Failures:** ${Array.isArray(report.failures) ? report.failures.length : "unavailable"}`);
            }
          } catch {
            console.log("**Status:** no deployment is verified; the verifier report was missing or invalid.");
          }
          NODE

      - name: Upload evidence verification artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: deployment-evidence-verification-${{ inputs.network }}
          path: |
            ${{ inputs.evidence_manifest }}
            deployment-evidence-report.json
          if-no-files-found: warn
