name: Session State Tracker

on:
  workflow_run:
    types: [completed]
    workflows: ['Documentation Validation', 'Validate', 'Deploy Testnet', 'Deploy Mainnet']

permissions:
  contents: write
  pull-requests: write

jobs:
  track-session:
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success'
    steps:
      - name: Checkout
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Session Report
        id: session
        run: |
          # Get workflow info
          WORKFLOW_NAME="${{ github.event.workflow_run.name }}"
          WORKFLOW_ID="${{ github.event.workflow_run.id }}"
          RUN_NUMBER="${{ github.event.workflow_run.run_number }}"
          
          echo "workflow_name=$WORKFLOW_NAME" >> $GITHUB_OUTPUT
          echo "session_id=SESSION_$(date +%Y%m%d)_$RUN_NUMBER" >> $GITHUB_OUTPUT
          echo "timestamp=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> $GITHUB_OUTPUT

      - name: Create Session Report
        run: |
          cat >> docs/DOCUMENTATION_STATE.md << 'EOF'
          
          ## Session Report (Automated)
          
          ```
          Session ID: ${{ steps.session.outputs.session_id }}
          Workflow: ${{ steps.session.outputs.workflow_name }}
          Timestamp: ${{ steps.session.outputs.timestamp }}
          Trigger: ${{ github.event.workflow_run.event }}
          Run URL: ${{ github.event.workflow_run.html_url }}
          ```
          
          _This section auto-generated by session-tracker workflow_
          EOF

      - name: Create Pull Request for Session Update
        if: github.event.workflow_run.event == 'pull_request'
        uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676 # v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "docs: auto-update session state [skip ci]"
          title: "chore: update session state tracker"
          body: |
            ## Automated Session State Update
            
            This PR updates DOCUMENTATION_STATE.md with the latest session information.
            
            - **Session ID**: ${{ steps.session.outputs.session_id }}
            - **Workflow**: ${{ steps.session.outputs.workflow_name }}
            - **Timestamp**: ${{ steps.session.outputs.timestamp }}
            
            _Automated by session-tracker workflow_
          branch: chore/update-session-state
          delete-branch: true
          labels: automated, documentation
