name: B2B Suite CI

on:
  push:
    branches: [ "main" ]
    paths:
      - 'lib-conclave-sdk/**'
      - 'conxian-nexus/**'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'lib-conclave-sdk/**'
      - 'conxian-nexus/**'

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Setup Rust
      uses: dtolnay/rust-toolchain@stable
    - name: Build B2B Suite
      run: make build-b2b
    - name: Test B2B Suite
      run: cd conxian-nexus && cargo test
