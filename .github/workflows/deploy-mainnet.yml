name: Deploy Mainnet

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (generate plan only, no deploy)'
        type: boolean
        default: true
      confirm:
        description: 'Type "DEPLOY_MAINNET" to confirm mainnet deployment'
        type: string
        required: true
      evidence_manifest:
        description: 'Path to a captured deployment evidence manifest; required when dry_run=false. Plans, workflow success, and broadcast-only IDs are not evidence.'
        type: string
        required: false
        default: ''

permissions:
  contents: read

jobs:
  validate-protocol:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Clarinet
        run: |
          set -euo pipefail
          VERSION="v3.21.0"
          curl -sSL -o clarinet.tar.gz "https://github.com/stx-labs/clarinet/releases/download/${VERSION}/clarinet-linux-x64-glibc.tar.gz"
          tar -xzf clarinet.tar.gz clarinet
          chmod +x clarinet
          sudo mv clarinet /usr/local/bin/clarinet
          clarinet --version

      - name: Snapshot deployment plan
        run: cp deployments/default.simnet-plan.yaml deployments/default.simnet-plan.yaml.bak

      - name: Clarinet Check
        run: clarinet check --manifest-path Clarinet.toml

      - name: Restore deployment plan (guard against clarinet rewrite)
        run: cp deployments/default.simnet-plan.yaml.bak deployments/default.simnet-plan.yaml

      - name: Run Full Test Suite
        run: npm run ci

      - name: Run Coverage
        run: npm run coverage

  deploy-mainnet:
    needs: validate-protocol
    runs-on: ubuntu-latest
    environment: mainnet
    if: ${{ inputs.confirm == 'DEPLOY_MAINNET' }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Clarinet
        run: |
          set -euo pipefail
          VERSION="v3.21.0"
          curl -sSL -o clarinet.tar.gz "https://github.com/stx-labs/clarinet/releases/download/${VERSION}/clarinet-linux-x64-glibc.tar.gz"
          tar -xzf clarinet.tar.gz clarinet
          chmod +x clarinet
          sudo mv clarinet /usr/local/bin/clarinet
          clarinet --version

      - name: Deploy to Mainnet
        if: ${{ !inputs.dry_run }}
        env:
          DEPLOYER_MNEMONIC: ${{ secrets.MAINNET_DEPLOYER_MNEMONIC }}
        run: |
          DEPLOY_LOG=$(mktemp)
          echo y | script -q -c "clarinet deployments apply \
            --manifest-path Clarinet.toml \
            --deployment-plan-path deployments/full-system.mainnet-plan.yaml" \
            "$DEPLOY_LOG"
          cat "$DEPLOY_LOG"
          rm "$DEPLOY_LOG"

      - name: Verify deployment evidence
        if: ${{ !inputs.dry_run }}
        env:
          EVIDENCE_MANIFEST: ${{ inputs.evidence_manifest }}
          HIRO_API_KEY: ${{ secrets.HIRO_API_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "$EVIDENCE_MANIFEST" ]]; then
            echo "::error::Confirmed receipt evidence is required before a mainnet deployment can be reported as verified. Plans, workflow success, and broadcast-only IDs are not evidence."
            exit 1
          fi
          if [[ ! -f "$EVIDENCE_MANIFEST" ]]; then
            echo "::error::Evidence manifest not found at $EVIDENCE_MANIFEST"
            exit 1
          fi
          npx tsx scripts/verify-deployment-evidence.ts \
            --manifest "$EVIDENCE_MANIFEST" \
            --output deployment-evidence-report.json

      - name: Generate Deployment Report
        if: always()
        run: |
          echo "## Mainnet Deployment Report" >> $GITHUB_STEP_SUMMARY
          echo "**Network:** Mainnet" >> $GITHUB_STEP_SUMMARY
          echo "**Plan:** deployments/full-system.mainnet-plan.yaml" >> $GITHUB_STEP_SUMMARY
          if [[ "${{ inputs.dry_run }}" == "true" ]]; then
            echo "**Status:** dry run only; no deployment is verified." >> $GITHUB_STEP_SUMMARY
          elif [[ -f deployment-evidence-report.json ]] && grep -q '"ok": true' deployment-evidence-report.json; then
            echo "**Status:** confirmed receipt, interface, and declared read-only evidence passed." >> $GITHUB_STEP_SUMMARY
          else
            echo "**Status:** no deployment is verified." >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload Deployment Plan Artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: mainnet-deployment-plan
          path: deployments/full-system.mainnet-plan.yaml

      - name: Upload Deployment Evidence Artifact
        if: ${{ always() && !inputs.dry_run && inputs.evidence_manifest != '' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: mainnet-deployment-evidence
          path: |
            ${{ inputs.evidence_manifest }}
            deployment-evidence-report.json
          if-no-files-found: error
