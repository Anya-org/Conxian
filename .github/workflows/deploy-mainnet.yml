name: Deploy Mainnet

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (validate and snapshot the plan only; no broadcast)'
        type: boolean
        default: true
      confirm:
        description: 'Type "DEPLOY_MAINNET" to confirm mainnet deployment'
        type: string
        required: true
      deployer:
        description: 'Canonical SP... mainnet deployer bound to this plan and attempt'
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: deploy-mainnet
  cancel-in-progress: false

env:
  PLAN_PATH: deployments/full-system.mainnet-plan.yaml
  EXPECTED_DEPLOYER: ${{ inputs.deployer }}

jobs:
  validate-confirmation:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require explicit mainnet confirmation
        env:
          CONFIRMATION: ${{ inputs.confirm }}
        run: |
          set -euo pipefail
          if [[ "$CONFIRMATION" != "DEPLOY_MAINNET" ]]; then
            echo "::error::Mainnet deployment requires confirm=DEPLOY_MAINNET; the deployment was not attempted."
            exit 1
          fi

  validate-protocol:
    needs: validate-confirmation
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Clarinet
        run: |
          set -euo pipefail
          VERSION="v3.21.0"
          curl -sSL -o clarinet.tar.gz "https://github.com/stx-labs/clarinet/releases/download/${VERSION}/clarinet-linux-x64-glibc.tar.gz"
          tar -xzf clarinet.tar.gz clarinet
          chmod +x clarinet
          sudo mv clarinet /usr/local/bin/clarinet
          clarinet --version

      - name: Snapshot deployment plan
        run: cp deployments/default.simnet-plan.yaml deployments/default.simnet-plan.yaml.bak

      - name: Clarinet Check
        run: clarinet check --manifest-path Clarinet.toml

      - name: Restore deployment plan (guard against clarinet rewrite)
        run: cp deployments/default.simnet-plan.yaml.bak deployments/default.simnet-plan.yaml

      - name: Validate mainnet plan principals
        env:
          EXPECTED_NETWORK: mainnet
          EXPECTED_DEPLOYER: ${{ inputs.deployer }}
        run: |
          set -euo pipefail
          ruby -ryaml <<'RUBY'
          plan = YAML.load_file(ENV.fetch("PLAN_PATH"))
          network = ENV.fetch("EXPECTED_NETWORK")
          deployer = ENV.fetch("EXPECTED_DEPLOYER")
          abort "deployment plan network mismatch" unless plan["network"] == network
          abort "deployment plan deployer mismatch" unless plan["deployer"] == deployer
          expected_prefix = network == "testnet" ? "ST" : "SP"
          abort "deployment plan deployer has the wrong network prefix" unless deployer.start_with?(expected_prefix)
          batches = plan.fetch("plan").fetch("batches")
          publishes = batches.flat_map { |batch| batch.fetch("transactions", []) }.filter_map { |tx| tx["contract-publish"] }
          invalid = publishes.reject do |publish|
            sender = publish["expected-sender"]
            sender == deployer && sender.to_s.start_with?(expected_prefix)
          end
          abort "#{invalid.length} contract-publish entries have the wrong expected-sender" unless invalid.empty?
          puts "Validated #{publishes.length} mainnet contract-publish sender entries"
          RUBY

      - name: Run Full Test Suite
        run: npm run ci

      - name: Run Coverage
        run: npm run coverage

  deploy-mainnet:
    needs: validate-protocol
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: mainnet
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Clarinet
        run: |
          set -euo pipefail
          VERSION="v3.21.0"
          curl -sSL -o clarinet.tar.gz "https://github.com/stx-labs/clarinet/releases/download/${VERSION}/clarinet-linux-x64-glibc.tar.gz"
          tar -xzf clarinet.tar.gz clarinet
          chmod +x clarinet
          sudo mv clarinet /usr/local/bin/clarinet
          clarinet --version

      - name: Broadcast to Mainnet
        id: apply
        if: ${{ inputs.dry_run == false }}
        env:
          DEPLOYER_MNEMONIC: ${{ secrets.MAINNET_DEPLOYER_MNEMONIC }}
        run: |
          set -euo pipefail
          mkdir -p deployment-artifacts
          DEPLOY_LOG=$(mktemp)
          if ! (echo y | script -q -c "clarinet deployments apply \
            --manifest-path Clarinet.toml \
            --deployment-plan-path ${PLAN_PATH}" "$DEPLOY_LOG") 2>&1 | tee deployment-artifacts/clarinet-apply.log; then
            cp "$DEPLOY_LOG" deployment-artifacts/clarinet-session.log || true
            rm -f "$DEPLOY_LOG"
            echo "::error::Mainnet broadcast/apply failed. Verification remains pending; no deployment is verified."
            exit 1
          fi
          cp "$DEPLOY_LOG" deployment-artifacts/clarinet-session.log
          rm -f "$DEPLOY_LOG"

      - name: Capture deployment attempt metadata
        if: always()
        env:
          DRY_RUN_INPUT: ${{ inputs.dry_run }}
          APPLY_OUTCOME: ${{ steps.apply.outcome }}
          DEPLOYED_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          mkdir -p deployment-artifacts
          PLAN_SHA256=$(sha256sum "$PLAN_PATH" | awk '{print $1}')
          export PLAN_SHA256
          node --input-type=module <<'NODE'
          import { writeFileSync } from "node:fs";

          const applySucceeded = process.env.APPLY_OUTCOME === "success";
          const status = process.env.DRY_RUN_INPUT === "true"
            ? "dry-run"
            : applySucceeded
              ? "verification-pending"
              : "apply-failed";
          const metadata = {
            schemaVersion: "1.0.0",
            network: "mainnet",
            deployer: process.env.EXPECTED_DEPLOYER,
            gitCommit: process.env.DEPLOYED_COMMIT,
            planPath: process.env.PLAN_PATH,
            planSha256: process.env.PLAN_SHA256,
            broadcastStatus: status,
            verificationStatus: status === "verification-pending"
              ? "verification pending"
              : "no deployment is verified",
            verificationWorkflow: ".github/workflows/verify-deployment-evidence.yml",
          };
          writeFileSync(
            "deployment-artifacts/deployment-attempt.json",
            `${JSON.stringify(metadata, null, 2)}\n`,
          );
          NODE

      - name: Generate Deployment Report
        if: always()
        run: |
          node --input-type=module <<'NODE' >> "$GITHUB_STEP_SUMMARY"
          import { readFileSync } from "node:fs";

          console.log("## Mainnet Deployment Report");
          console.log("**Network:** Mainnet");
          console.log("**Plan:** `deployments/full-system.mainnet-plan.yaml`");
          try {
            const report = JSON.parse(readFileSync("deployment-artifacts/deployment-attempt.json", "utf8"));
            console.log(`**Broadcast status:** ${report.broadcastStatus}`);
            console.log(`**Verification status:** ${report.verificationStatus}`);
            console.log("**Scope:** no deployment is verified by this broadcast workflow; use the separate evidence verification workflow.");
          } catch {
            console.log("**Status:** no deployment is verified; deployment attempt metadata was unavailable.");
          }
          NODE

      - name: Upload Mainnet Deployment Artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: mainnet-deployment-attempt
          path: |
            deployment-artifacts
            deployments/full-system.mainnet-plan.yaml
          if-no-files-found: warn
