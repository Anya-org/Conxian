name: Deploy Mainnet

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run/preflight only (no signer, broadcast, or deployment proof)'
        type: boolean
        default: true
      confirm:
        description: 'Type "DEPLOY_MAINNET" to request a non-dry attempt'
        type: string
        required: true
      deployer:
        description: 'Canonical SP... mainnet deployer bound to this plan and attempt'
        type: string
        required: true
      expected_plan_sha256:
        description: 'Exact SHA-256 of deployments/full-system.mainnet-plan.yaml'
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: conxian-deploy-mainnet
  cancel-in-progress: false

env:
  PLAN_PATH: deployments/full-system.mainnet-plan.yaml

jobs:
  validate-confirmation:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require explicit mainnet confirmation
        env:
          CONFIRMATION: ${{ inputs.confirm }}
        run: |
          set -euo pipefail
          if [[ "$CONFIRMATION" != "DEPLOY_MAINNET" ]]; then
            echo "::error::Mainnet deployment requires confirm=DEPLOY_MAINNET; the deployment was not attempted."
            exit 1
          fi

  validate-protocol:
    needs: validate-confirmation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Clarinet
        run: |
          set -euo pipefail
          VERSION="v3.21.0"
          curl -sSL -o clarinet.tar.gz "https://github.com/stx-labs/clarinet/releases/download/${VERSION}/clarinet-linux-x64-glibc.tar.gz"
          tar -xzf clarinet.tar.gz clarinet
          chmod +x clarinet
          sudo mv clarinet /usr/local/bin/clarinet
          clarinet --version

      - name: Snapshot deployment plan
        run: cp deployments/default.simnet-plan.yaml deployments/default.simnet-plan.yaml.bak

      - name: Clarinet Check
        run: clarinet check --manifest-path Clarinet.toml

      - name: Restore deployment plan (guard against clarinet rewrite)
        run: cp deployments/default.simnet-plan.yaml.bak deployments/default.simnet-plan.yaml

      - name: Validate checked-in deployment plans
        run: |
          python3 -m pip install --user --disable-pip-version-check 'PyYAML==6.0.2'
          python3 scripts/gen-deployment-plans.py --check

      - name: Validate mainnet plan semantics
        env:
          EXPECTED_NETWORK: mainnet
          EXPECTED_DEPLOYER: ${{ inputs.deployer }}
        run: ruby scripts/validate-deployment-plan.rb "$PLAN_PATH" "$EXPECTED_NETWORK" "$EXPECTED_DEPLOYER"

      - name: Run focused deployment safety tests
        run: |
          npm run test:deployment-evidence
          npm run test:release-plan-validation
          npx vitest run tests/deploy-testnet-script.test.ts tests/deployment-workflows.test.ts --config vitest.config.ts --pool=threads

  preflight-mainnet:
    needs: validate-protocol
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: mainnet
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Prepare plan-only artifacts
        run: mkdir -p deployment-artifacts

      - name: Validate exact mainnet plan, source metadata, and signer identity gate
        env:
          EXPECTED_PLAN_SHA256: ${{ inputs.expected_plan_sha256 }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          PLAN="deployments/full-system.mainnet-plan.yaml"
          COMMITTED=$(tr -d '[:space:]' < deployments/full-system.mainnet-plan.sha256)
          ACTUAL=$(sha256sum "$PLAN" | awk '{print $1}')
          if ! [[ "$EXPECTED_PLAN_SHA256" =~ ^[0-9a-f]{64}$ ]]; then
            echo "Expected mainnet plan SHA-256 input is malformed."
            exit 1
          fi
          if [ "$EXPECTED_PLAN_SHA256" != "$ACTUAL" ]; then
            echo "Mainnet plan SHA-256 input does not match the checked-in plan."
            exit 1
          fi
          if ! [[ "$COMMITTED" =~ ^[0-9a-f]{64}$ ]] || [ "$COMMITTED" != "$ACTUAL" ]; then
            echo "Committed mainnet plan digest does not match the checked-in plan."
            exit 1
          fi
          NETWORK=$(awk '$1 == "network:" { print $2; exit }' "$PLAN")
          DEPLOYER=$(awk '$1 == "deployer:" { print $2; exit }' "$PLAN")
          test "$NETWORK" = "mainnet"
          case "$DEPLOYER" in
            SP*|SM*) ;;
            *)
              echo "::error::Current mainnet plan identity is unresolved: $DEPLOYER is not an approved mainnet SP/SM identity. Replace it only with an approved identity derived and verified against the configured signer; do not guess an address."
              if [ "$DRY_RUN" != "true" ]; then exit 1; fi
              ;;
          esac
          printf '%s  %s\n' "$ACTUAL" "$PLAN" > deployment-artifacts/mainnet-plan.sha256
          cat > deployment-artifacts/mainnet-preflight.json <<EOF
          {
            "status": "plan-only/preflight",
            "network": "$NETWORK",
            "deployer": "$DEPLOYER",
            "sourceCommit": "$(git rev-parse HEAD)",
            "plan": "$PLAN",
            "planSha256": "$ACTUAL",
            "broadcast": false,
            "deploymentProof": false
          }
          EOF

      - name: Block non-dry broadcast attempts before signing
        if: ${{ !inputs.dry_run }}
        run: |
          echo "::error::Mainnet broadcast is blocked before signing. An authorized structured receipt-producing broadcaster/execution path remains required; follow the deployment runbook preflight and do not use a workflow success as deployment proof."
          exit 1

      - name: Write plan-only summary
        if: always()
        run: |
          {
            echo "## Mainnet preflight (plan-only)"
            echo "- Status: plan/preflight only"
            echo "- No mnemonic, signer, broadcast, or deployment proof was used"
            echo "- Non-dry attempts are blocked before signing pending an authorized structured receipt-producing broadcaster/execution path"
            echo "- The current ST mainnet plan identity remains an unresolved blocker"
            echo "- No automatic testnet-to-mainnet dispatch is defined"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload plan-only artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: mainnet-plan-preflight
          path: |
            deployments/full-system.mainnet-plan.yaml
            deployments/full-system.mainnet-plan.sha256
            deployment-artifacts/
          if-no-files-found: warn
