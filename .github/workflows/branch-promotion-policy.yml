name: Branch Promotion Policy

on:
  pull_request:
    types: [opened, reopened, synchronize, edited]
    branches: [ main, staged, dev ]

jobs:
  enforce:
    name: Enforce branch promotion rules
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Validate base/head branch relationship
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const base = pr.base.ref;
            const head = pr.head.ref;
            const baseRepo =
              pr.base.repo?.full_name ??
              `${context.repo.owner}/${context.repo.repo}`;
            const headRepo =
              pr.head.repo?.full_name ??
              pr.head.label?.split(':')[0] ??
              'unknown';

            core.info(
              `Branch promotion check: ${headRepo}:${head} -> ${baseRepo}:${base}`
            );

            if ((base === 'main' || base === 'staged') && headRepo !== baseRepo) {
              core.setFailed(
                `Promotions into '${base}' must come from an in-repo branch (got fork '${headRepo}:${head}' -> '${baseRepo}:${base}').`
              );
              return;
            }

            if (base === 'main' && head !== 'staged') {
              core.setFailed(
                `PRs into 'main' must come from 'staged' (got '${head}' -> '${base}').`
              );
              return;
            }

            if (base === 'staged') {
              const allowed = head === 'dev' || head.startsWith('hotfix/');

              if (!allowed) {
                core.setFailed(
                  `PRs into 'staged' must come from 'dev' (or 'hotfix/*') (got '${head}' -> '${base}').`
                );
              }
            }
