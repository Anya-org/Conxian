name: Deploy Testnet

on:
  push:
    branches:
      - dev
    paths:
      - 'contracts/**'
      - 'Clarinet.toml'
      - 'settings/Testnet.toml'
      - 'deployments/**'
      - 'scripts/gen-deployment-plans.py'
      - 'scripts/release_plan_validation.py'
      - 'scripts/validate-deployment-plan.rb'
      - 'scripts/deployment/**'
      - 'scripts/deploy-testnet.ts'
      - 'package.json'
      - 'tests/test_release_plan_validation.py'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run/preflight only (no signer, broadcast, or deployment proof)'
        type: boolean
        default: true
      expected_plan_sha256:
        description: 'Optional exact SHA-256 of deployments/full-system.testnet-plan.yaml'
        type: string
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: conxian-deploy-testnet
  cancel-in-progress: false

env:
  PLAN_PATH: deployments/full-system.testnet-plan.yaml

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Clarinet
        run: |
          set -euo pipefail
          VERSION="v3.21.0"
          curl -sSL -o clarinet.tar.gz "https://github.com/stx-labs/clarinet/releases/download/${VERSION}/clarinet-linux-x64-glibc.tar.gz"
          tar -xzf clarinet.tar.gz clarinet
          chmod +x clarinet
          sudo mv clarinet /usr/local/bin/clarinet
          clarinet --version

      - name: Snapshot deployment plan
        run: cp deployments/default.simnet-plan.yaml deployments/default.simnet-plan.yaml.bak

      - name: Clarinet Check
        run: clarinet check --manifest-path Clarinet.toml

      - name: Restore deployment plan (guard against clarinet rewrite)
        run: cp deployments/default.simnet-plan.yaml.bak deployments/default.simnet-plan.yaml

      - name: Validate checked-in deployment plans
        run: |
          python3 -m pip install --user --disable-pip-version-check 'PyYAML==6.0.2'
          python3 scripts/gen-deployment-plans.py --check

      - name: Validate testnet plan semantics
        run: |
          DEPLOYER=$(awk '$1 == "deployer:" { print $2; exit }' "$PLAN_PATH")
          ruby scripts/validate-deployment-plan.rb "$PLAN_PATH" testnet "$DEPLOYER"

      - name: Run focused deployment safety tests
        run: |
          npm run test:deployment-evidence
          npm run test:release-plan-validation
          npx vitest run tests/deploy-testnet-script.test.ts tests/deployment-workflows.test.ts --config vitest.config.ts --pool=threads

  preflight-testnet:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Prepare plan-only artifacts
        run: mkdir -p deployment-artifacts

      - name: Validate exact testnet plan and source metadata
        env:
          EXPECTED_PLAN_SHA256: ${{ inputs.expected_plan_sha256 || '' }}
        run: |
          set -euo pipefail
          PLAN="deployments/full-system.testnet-plan.yaml"
          ACTUAL=$(sha256sum "$PLAN" | awk '{print $1}')
          if [ -n "$EXPECTED_PLAN_SHA256" ]; then
            if ! [[ "$EXPECTED_PLAN_SHA256" =~ ^[0-9a-f]{64}$ ]]; then
              echo "Expected testnet plan SHA-256 input is malformed."
              exit 1
            fi
            if [ "$EXPECTED_PLAN_SHA256" != "$ACTUAL" ]; then
              echo "Testnet plan SHA-256 input does not match the checked-in plan."
              exit 1
            fi
          fi
          NETWORK=$(awk '$1 == "network:" { print $2; exit }' "$PLAN")
          DEPLOYER=$(awk '$1 == "deployer:" { print $2; exit }' "$PLAN")
          test "$NETWORK" = "testnet"
          case "$DEPLOYER" in
            ST*|SN*) ;;
            *) echo "Testnet plan deployer must be a testnet ST/SN identity."; exit 1 ;;
          esac
          printf '%s  %s\n' "$ACTUAL" "$PLAN" > deployment-artifacts/testnet-plan.sha256
          cat > deployment-artifacts/testnet-preflight.json <<EOF
          {
            "status": "plan-only/preflight",
            "network": "$NETWORK",
            "deployer": "$DEPLOYER",
            "sourceCommit": "$(git rev-parse HEAD)",
            "plan": "$PLAN",
            "planSha256": "$ACTUAL",
            "broadcast": false,
            "deploymentProof": false
          }
          EOF

      - name: Block non-dry broadcast attempts before signing
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run == false }}
        run: |
          echo "::error::Testnet broadcast is blocked before signing. An authorized structured receipt-producing broadcaster/execution path remains required; use the deployment runbook preflight until that gate is implemented."
          exit 1

      - name: Write plan-only summary
        if: always()
        run: |
          {
            echo "## Testnet preflight (plan-only)"
            echo "- Status: plan/preflight only"
            echo "- No mnemonic, signer, broadcast, or deployment proof was used"
            echo "- A non-dry request is blocked before signing pending an authorized structured receipt-producing broadcaster/execution path"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload plan-only artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: testnet-plan-preflight
          path: |
            deployments/full-system.testnet-plan.yaml
            deployment-artifacts/
          if-no-files-found: warn
