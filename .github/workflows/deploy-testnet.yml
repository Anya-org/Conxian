name: Deploy Testnet

on:
  push:
    branches:
      - dev
    paths:
      - 'contracts/**'
      - 'Clarinet.toml'
      - 'settings/Testnet.toml'
      - 'deployments/**'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (generate plan only, no deploy)'
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Clarinet
        run: |
          set -euo pipefail
          VERSION="v3.21.0"
          curl -sSL -o clarinet.tar.gz "https://github.com/stx-labs/clarinet/releases/download/${VERSION}/clarinet-linux-x64-glibc.tar.gz"
          tar -xzf clarinet.tar.gz clarinet
          chmod +x clarinet
          sudo mv clarinet /usr/local/bin/clarinet
          clarinet --version

      - name: Snapshot deployment plan
        run: cp deployments/default.simnet-plan.yaml deployments/default.simnet-plan.yaml.bak

      - name: Clarinet Check
        run: clarinet check --manifest-path Clarinet.toml

      - name: Restore deployment plan (guard against clarinet rewrite)
        run: cp deployments/default.simnet-plan.yaml.bak deployments/default.simnet-plan.yaml

      - name: Run Full Test Suite
        run: npm run ci

  deploy-testnet:
    needs: validate
    runs-on: ubuntu-latest
    environment: testnet
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Clarinet
        run: |
          set -euo pipefail
          VERSION="v3.21.0"
          curl -sSL -o clarinet.tar.gz "https://github.com/stx-labs/clarinet/releases/download/${VERSION}/clarinet-linux-x64-glibc.tar.gz"
          tar -xzf clarinet.tar.gz clarinet
          chmod +x clarinet
          sudo mv clarinet /usr/local/bin/clarinet
          clarinet --version

      - name: Prepare deployment artifacts
        if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && !inputs.dry_run) }}
        run: mkdir -p deployment-artifacts

      - name: Deploy to Testnet
        if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && !inputs.dry_run) }}
        env:
          DEPLOYER_MNEMONIC: ${{ secrets.TESTNET_DEPLOYER_MNEMONIC }}
        run: |
          set -euo pipefail
          DEPLOY_LOG="deployment-artifacts/testnet-clarinet.log"
          if ! echo y | script -q -c "clarinet deployments apply \
            --manifest-path Clarinet.toml \
            --deployment-plan-path deployments/full-system.testnet-plan.yaml" \
            "$DEPLOY_LOG"; then
            cat "$DEPLOY_LOG"
            echo "Clarinet deployment failed; no completion claim is emitted."
            exit 1
          fi
          cat "$DEPLOY_LOG"

      - name: Verify canonical deployment evidence
        if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && !inputs.dry_run) }}
        run: |
          set -euo pipefail
          EVIDENCE="deployment-artifacts/testnet-evidence.json"
          if [ ! -s "$EVIDENCE" ]; then
            echo "Missing deployment evidence bundle at $EVIDENCE. A plan, workflow success, or broadcast is not a receipt."
            exit 1
          fi
          DEPLOYER=$(awk '$1 == "deployer:" { print $2; exit }' deployments/full-system.testnet-plan.yaml)
          test -n "$DEPLOYER"
          npx tsx scripts/deployment/verify-evidence.ts \
            --evidence "$EVIDENCE" \
            --network testnet \
            --deployer "$DEPLOYER" \
            --plan deployments/full-system.testnet-plan.yaml \
            --source-commit "$GITHUB_SHA" \
            --output deployment-artifacts/testnet-evidence.verified.json

      - name: Smoke Test Deployed Contracts
        if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && !inputs.dry_run) }}
        run: |
          echo "Running post-deployment smoke tests after canonical evidence verification..."
          npx vitest run tests/sanity.test.ts tests/check-compile.test.ts --config vitest.config.ts --pool=threads

      - name: Generate Deployment Report
        if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && !inputs.dry_run) }}
        run: |
          set -euo pipefail
          DEPLOYER=$(awk '$1 == "deployer:" { print $2; exit }' deployments/full-system.testnet-plan.yaml)
          echo "## Testnet Deployment Report" >> "$GITHUB_STEP_SUMMARY"
          echo "**Deployer:** $DEPLOYER" >> "$GITHUB_STEP_SUMMARY"
          echo "**Network:** Testnet" >> "$GITHUB_STEP_SUMMARY"
          echo "**Plan:** deployments/full-system.testnet-plan.yaml" >> "$GITHUB_STEP_SUMMARY"
          echo "**Evidence:** deployment-artifacts/testnet-evidence.verified.json" >> "$GITHUB_STEP_SUMMARY"
          echo "**Status:** canonical receipt and interface verification passed" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Deployment Artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: testnet-deployment-artifacts
          path: |
            deployments/full-system.testnet-plan.yaml
            deployment-artifacts/
          if-no-files-found: warn
