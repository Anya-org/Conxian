name: Deploy Testnet

on:
  push:
    branches:
      - dev
    paths:
      - 'contracts/**'
      - 'Clarinet.toml'
      - 'settings/Testnet.toml'
      - 'deployments/**'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (validate and snapshot the plan only; no broadcast)'
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: deploy-testnet-${{ github.ref }}
  cancel-in-progress: false

env:
  PLAN_PATH: deployments/full-system.testnet-plan.yaml
  EXPECTED_DEPLOYER: ST1BK6TFDEJ4TBVWH5SHNB6SPNWGY06YZFG9WMM4P

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Clarinet
        run: |
          set -euo pipefail
          VERSION="v3.21.0"
          curl -sSL -o clarinet.tar.gz "https://github.com/stx-labs/clarinet/releases/download/${VERSION}/clarinet-linux-x64-glibc.tar.gz"
          tar -xzf clarinet.tar.gz clarinet
          chmod +x clarinet
          sudo mv clarinet /usr/local/bin/clarinet
          clarinet --version

      - name: Snapshot deployment plan
        run: cp deployments/default.simnet-plan.yaml deployments/default.simnet-plan.yaml.bak

      - name: Clarinet Check
        run: clarinet check --manifest-path Clarinet.toml

      - name: Restore deployment plan (guard against clarinet rewrite)
        run: cp deployments/default.simnet-plan.yaml.bak deployments/default.simnet-plan.yaml

      - name: Validate testnet plan principals
        env:
          EXPECTED_NETWORK: testnet
          EXPECTED_DEPLOYER: ST1BK6TFDEJ4TBVWH5SHNB6SPNWGY06YZFG9WMM4P
        run: |
          set -euo pipefail
          ruby scripts/validate-deployment-plan.rb "$PLAN_PATH" "$EXPECTED_NETWORK" "$EXPECTED_DEPLOYER"

      - name: Run Full Test Suite
        run: npm run ci

  deploy-testnet:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: testnet
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Clarinet
        run: |
          set -euo pipefail
          VERSION="v3.21.0"
          curl -sSL -o clarinet.tar.gz "https://github.com/stx-labs/clarinet/releases/download/${VERSION}/clarinet-linux-x64-glibc.tar.gz"
          tar -xzf clarinet.tar.gz clarinet
          chmod +x clarinet
          sudo mv clarinet /usr/local/bin/clarinet
          clarinet --version

      - name: Broadcast to Testnet
        id: apply
        if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.dry_run == false) }}
        env:
          DEPLOYER_MNEMONIC: ${{ secrets.TESTNET_DEPLOYER_MNEMONIC }}
        run: |
          set -euo pipefail
          mkdir -p deployment-artifacts
          DEPLOY_LOG=$(mktemp)
          if ! (echo y | script -q -c "clarinet deployments apply \
            --manifest-path Clarinet.toml \
            --deployment-plan-path ${PLAN_PATH}" "$DEPLOY_LOG") >/dev/null 2>&1; then
            rm -f "$DEPLOY_LOG"
            echo "::error::Testnet broadcast/apply failed. Verification remains pending; no deployment is verified."
            exit 1
          fi
          rm -f "$DEPLOY_LOG"

      - name: Capture deployment attempt metadata
        if: always()
        env:
          EVENT_NAME: ${{ github.event_name }}
          DRY_RUN_INPUT: ${{ inputs.dry_run }}
          APPLY_OUTCOME: ${{ steps.apply.outcome }}
          DEPLOYED_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          mkdir -p deployment-artifacts
          PLAN_SHA256=$(sha256sum "$PLAN_PATH" | awk '{print $1}')
          export PLAN_SHA256
          node --input-type=module <<'NODE'
          import { writeFileSync } from "node:fs";

          const deployed = process.env.EVENT_NAME === "push" || process.env.DRY_RUN_INPUT === "false";
          const applySucceeded = process.env.APPLY_OUTCOME === "success";
          const status = !deployed
            ? "dry-run"
            : applySucceeded
              ? "verification-pending"
              : "apply-failed";
          const metadata = {
            schemaVersion: "1.0.0",
            network: "testnet",
            deployer: process.env.EXPECTED_DEPLOYER,
            gitCommit: process.env.DEPLOYED_COMMIT,
            planPath: process.env.PLAN_PATH,
            planSha256: process.env.PLAN_SHA256,
            broadcastStatus: status,
            verificationStatus: status === "verification-pending"
              ? "verification pending"
              : "no deployment is verified",
            verificationWorkflow: ".github/workflows/verify-deployment-evidence.yml",
          };
          writeFileSync(
            "deployment-artifacts/deployment-attempt.json",
            `${JSON.stringify(metadata, null, 2)}\n`,
          );
          NODE

      - name: Generate Deployment Report
        if: always()
        run: |
          node --input-type=module <<'NODE' >> "$GITHUB_STEP_SUMMARY"
          import { readFileSync } from "node:fs";

          console.log("## Testnet Deployment Report");
          console.log("**Network:** Testnet");
          console.log("**Plan:** `deployments/full-system.testnet-plan.yaml`");
          try {
            const report = JSON.parse(readFileSync("deployment-artifacts/deployment-attempt.json", "utf8"));
            console.log(`**Broadcast status:** ${report.broadcastStatus}`);
            console.log(`**Verification status:** ${report.verificationStatus}`);
            console.log("**Scope:** no deployment is verified by this broadcast workflow; use the separate evidence verification workflow.");
          } catch {
            console.log("**Status:** no deployment is verified; deployment attempt metadata was unavailable.");
          }
          NODE

      - name: Upload Testnet Deployment Artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: testnet-deployment-attempt
          path: |
            deployment-artifacts/deployment-attempt.json
            deployments/full-system.testnet-plan.yaml
          if-no-files-found: warn
