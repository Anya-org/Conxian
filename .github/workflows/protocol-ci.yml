name: Conxian Protocol CI

on:
  push:
    branches:
      - main
      - dev
    paths-ignore:
      - 'ui/**'
      - 'docs/**'
      - '*.md'
  pull_request:
    branches:
      - main

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      contracts: ${{ steps.filter.outputs.contracts }}
      tests: ${{ steps.filter.outputs.tests }}
      any_protocol: ${{ steps.filter.outputs.any_protocol }}
      # Specific paths for intelligent testing
      access: ${{ steps.filter.outputs.access }}
      agents: ${{ steps.filter.outputs.agents }}
      compliance: ${{ steps.filter.outputs.compliance }}
      core: ${{ steps.filter.outputs.core }}
      dex: ${{ steps.filter.outputs.dex }}
      dimensional: ${{ steps.filter.outputs.dimensional }}
      enterprise: ${{ steps.filter.outputs.enterprise }}
      governance: ${{ steps.filter.outputs.governance }}
      lending: ${{ steps.filter.outputs.lending }}
      monitoring: ${{ steps.filter.outputs.monitoring }}
      oracle: ${{ steps.filter.outputs.oracle }}
      tokens: ${{ steps.filter.outputs.tokens }}
      treasury: ${{ steps.filter.outputs.treasury }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4
        id: filter
        with:
          filters: |
            any_protocol:
              - 'contracts/**'
              - 'tests/**'
              - 'Clarinet.toml'
              - 'package.json'
              - 'package-lock.json'
              - 'vitest.config.ts'
              - '.github/workflows/**'
              - 'CODEOWNERS'
              - '.github/CODEOWNERS'
              - 'deployments/**'
              - 'scripts/**'
              - 'docs/MAIN_BRANCH_GOVERNANCE.md'
              - 'docs/OPERATIONS_VERIFICATION_PATH.md'
            contracts:
              - 'contracts/**'
            tests:
              - 'tests/**'
            access:
              - 'contracts/access/**'
            agents:
              - 'contracts/agents/**'
              - 'tests/agents/**'
            compliance:
              - 'contracts/compliance/**'
              - 'tests/compliance/**'
            core:
              - 'contracts/core/**'
              - 'tests/core/**'
            dex:
              - 'contracts/dex/**'
              - 'tests/dex/**'
            dimensional:
              - 'contracts/dimensional/**'
            enterprise:
              - 'contracts/enterprise/**'
              - 'tests/enterprise/**'
            governance:
              - 'contracts/governance/**'
              - 'tests/governance/**'
            lending:
              - 'contracts/lending/**'
              - 'tests/lending/**'
            monitoring:
              - 'contracts/monitoring/**'
              - 'tests/monitoring/**'
            oracle:
              - 'contracts/oracle/**'
              - 'tests/oracle/**'
            tokens:
              - 'contracts/tokens/**'
            treasury:
              - 'contracts/treasury/**'

  validate-protocol:
    needs: changes
    if: ${{ needs.changes.outputs.any_protocol == 'true' || github.event_name == 'push' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install deployment assertion dependencies
        run: python3 -m pip install --user --disable-pip-version-check 'PyYAML==6.0.2'

      - name: Assert community voting deployment wiring
        run: npm run assert:community-voting-wiring

      - name: Install Clarinet
        run: |
          set -euo pipefail
          VERSION="v3.21.0"
          curl -sSL -o clarinet.tar.gz "https://github.com/stx-labs/clarinet/releases/download/${VERSION}/clarinet-linux-x64-glibc.tar.gz"
          tar -xzf clarinet.tar.gz clarinet
          chmod +x clarinet
          sudo mv clarinet /usr/local/bin/clarinet
          clarinet --version

      - name: Snapshot deployment plan
        run: cp deployments/default.simnet-plan.yaml deployments/default.simnet-plan.yaml.bak

      - name: Clarinet Check
        run: clarinet check --manifest-path Clarinet.toml

      - name: Restore deployment plan (guard against clarinet rewrite)
        run: |
          if ! diff -q deployments/default.simnet-plan.yaml deployments/default.simnet-plan.yaml.bak > /dev/null 2>&1; then
            echo "⚠️  Clarinet modified deployment plan - restoring original"
            cp deployments/default.simnet-plan.yaml.bak deployments/default.simnet-plan.yaml
          fi

      - name: Validate generated release plans
        run: |
          npm run validate:deployment-plans
          npm run test:release-plan-validation

      - name: Run Intelligent Tests (PR only)
        if: github.event_name == 'pull_request'
        env:
          AGENTS_CHANGED: ${{ needs.changes.outputs.agents }}
          COMPLIANCE_CHANGED: ${{ needs.changes.outputs.compliance }}
          CORE_CHANGED: ${{ needs.changes.outputs.core }}
          DEX_CHANGED: ${{ needs.changes.outputs.dex }}
          ENTERPRISE_CHANGED: ${{ needs.changes.outputs.enterprise }}
          GOVERNANCE_CHANGED: ${{ needs.changes.outputs.governance }}
          LENDING_CHANGED: ${{ needs.changes.outputs.lending }}
          MONITORING_CHANGED: ${{ needs.changes.outputs.monitoring }}
          ORACLE_CHANGED: ${{ needs.changes.outputs.oracle }}
          PROTOCOL_CHANGED: ${{ needs.changes.outputs.any_protocol }}
        run: |
          set -euo pipefail
          test_targets=()
          # Only access has dedicated test files; tokens, treasury, dimensional
          # tests live in tests/core/ and are picked up by the fallback.
          if [[ "$AGENTS_CHANGED" == "true" ]]; then test_targets+=(tests/agents/); fi
          if [[ "$COMPLIANCE_CHANGED" == "true" ]]; then test_targets+=(tests/compliance/); fi
          if [[ "$CORE_CHANGED" == "true" ]]; then test_targets+=(tests/core/); fi
          if [[ "$DEX_CHANGED" == "true" ]]; then
            # predictive-scaling-system.test.ts is intentionally root-level;
            # keep it in the DEX target so a DEX-only PR cannot skip it.
            test_targets+=(tests/dex/ tests/predictive-scaling-system.test.ts)
          fi
          if [[ "$ENTERPRISE_CHANGED" == "true" ]]; then test_targets+=(tests/enterprise/); fi
          if [[ "$GOVERNANCE_CHANGED" == "true" ]]; then test_targets+=(tests/governance/); fi
          if [[ "$LENDING_CHANGED" == "true" ]]; then test_targets+=(tests/lending/); fi
          if [[ "$MONITORING_CHANGED" == "true" ]]; then test_targets+=(tests/monitoring/); fi
          if [[ "$ORACLE_CHANGED" == "true" ]]; then test_targets+=(tests/oracle/); fi
          # tokens, treasury, dimensional have no dedicated test dirs;
          # changes there trigger the fallback below.

          if [[ ${#test_targets[@]} -eq 0 && "$PROTOCOL_CHANGED" == "true" ]]; then
            echo "Generic or infrastructure protocol change detected, running full test suite..."
          fi

          if [[ ${#test_targets[@]} -gt 0 ]]; then
            printf 'Running domain-specific tests:'
            printf ' %q' "${test_targets[@]}"
            printf '\n'
            bash scripts/run-tests.sh "${test_targets[@]}"
          else
            echo "Running full test suite..."
            bash scripts/run-tests.sh
          fi

      - name: Run Full Tests (Push)
        if: github.event_name == 'push'
        run: npm run ci

      - name: Run Coverage (Push)
        if: github.event_name == 'push'
        run: npm run coverage

      - name: Upload Test Logs on Failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: protocol-test-logs
          path: |
            *.log
            npm-debug.log*
            coverage/

  protocol-merge-gate:
    name: protocol-merge-gate
    needs:
      - changes
      - validate-protocol
    if: ${{ always() && github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    env:
      CLASSIFIER_RESULT: ${{ needs.changes.result }}
      PROTOCOL_CHANGED: ${{ needs.changes.outputs.any_protocol }}
      VALIDATION_RESULT: ${{ needs.validate-protocol.result }}
    steps:
      - name: Enforce protocol merge gate
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$CLASSIFIER_RESULT" != "success" ]]; then
            echo "Path classification did not succeed: $CLASSIFIER_RESULT"
            exit 1
          fi

          case "$PROTOCOL_CHANGED" in
            true)
              if [[ "$VALIDATION_RESULT" != "success" ]]; then
                echo "Protocol-sensitive changes require successful validation; result: $VALIDATION_RESULT"
                exit 1
              fi
              ;;
            false)
              if [[ "$VALIDATION_RESULT" != "skipped" ]]; then
                echo "Non-sensitive changes should skip heavy validation; result: $VALIDATION_RESULT"
                exit 1
              fi
              ;;
            *)
              echo "Path classification returned an invalid protocol flag: $PROTOCOL_CHANGED"
              exit 1
              ;;
          esac

          echo "Protocol merge gate passed."
