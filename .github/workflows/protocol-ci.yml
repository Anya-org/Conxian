name: Conxian Protocol CI

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'ui/**'
      - 'docs/**'
      - '*.md'
  pull_request:
    paths-ignore:
      - 'ui/**'
      - 'docs/**'
      - '*.md'

permissions:
  contents: read

jobs:
  validate-protocol:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Clarinet
        run: |
          set -euo pipefail
          VERSION="v3.2.0"
          curl -sSL -o clarinet.tar.gz "https://github.com/hirosystems/clarinet/releases/download/${VERSION}/clarinet-linux-x64-glibc.tar.gz"
          tar -xzf clarinet.tar.gz clarinet
          chmod +x clarinet
          sudo mv clarinet /usr/local/bin/clarinet
          clarinet --version

      - name: Clarinet Check
        run: clarinet check --manifest-path Clarinet.toml

      - name: Run CI Tests
        run: npm run ci

      - name: Run Coverage
        run: npm run coverage
