name: Conxian Protocol CI

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'ui/**'
      - 'docs/**'
      - '*.md'
  pull_request:
    paths-ignore:
      - 'ui/**'
      - 'docs/**'
      - '*.md'

permissions:
  contents: read

jobs:
  validate-protocol:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Clarinet
        run: |
          VERSION="v3.2.0"
          curl -sSL -o clarinet.tar.gz "https://github.com/hirosystems/clarinet/releases/download/${VERSION}/clarinet-linux-x64-glibc.tar.gz"
          tar -xzf clarinet.tar.gz
          sudo install -m 755 clarinet /usr/local/bin/clarinet

      - name: Clarinet Check
        run: npm run clarinet:check

      - name: Run CI Tests
        run: npm run ci

      - name: Run Coverage
        run: npm run coverage
