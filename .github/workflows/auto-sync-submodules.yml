name: Auto Sync Submodules

on:
  schedule:
    # Run at 00:00 every day
    - cron: '0 0 * * *'
  workflow_dispatch: # Allow manual triggering

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
        with:
          submodules: true
          fetch-depth: 0
          token: ${{ secrets.CI_SUBMODULES_PAT || github.token }}

      - name: Update Submodules to Latest Main
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          
          # Initialize and update submodules recursively to track their defined branches (main)
          git submodule update --init --recursive --remote

      - name: Create pull request
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.CI_SUBMODULES_PAT || github.token }}
          commit-message: "chore: auto-sync submodules"
          title: "chore: auto-sync submodules"
          body: |
            Automated submodule update to the latest configured branches.

            This workflow intentionally opens a PR rather than pushing directly to `main`.
          branch: bot/auto-sync-submodules
          delete-branch: true
