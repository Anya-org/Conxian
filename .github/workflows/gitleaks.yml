name: gitleaks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          set -euo pipefail

          version="8.30.1"
          asset="gitleaks_${version}_linux_x64.tar.gz"
          checksums="gitleaks_${version}_checksums.txt"

          curl -sSL -o "$asset" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${version}/${asset}"
          curl -sSL -o "$checksums" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${version}/${checksums}"

          grep " ${asset}$" "$checksums" | sha256sum -c -

          install_dir="$RUNNER_TEMP/gitleaks"
          mkdir -p "$install_dir"
          tar -xzf "$asset" -C "$install_dir" gitleaks
          echo "$install_dir" >> "$GITHUB_PATH"

      - name: Scan (pull_request)
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          tmp_dir="${RUNNER_TEMP:-/tmp}"

          base_sha="${{ github.event.pull_request.base.sha }}"
          head_sha="${{ github.event.pull_request.head.sha }}"

          config_args=()
          if git cat-file -e "${base_sha}:gitleaks.toml" 2>/dev/null; then
            mkdir -p "$tmp_dir"
            config_path="$(mktemp "${tmp_dir}/gitleaks-config-XXXXXX.toml")"
            git show "${base_sha}:gitleaks.toml" > "$config_path"
            config_args+=(--config="$config_path")
          fi

          gitleaks detect \
            --no-banner \
            --redact \
            "${config_args[@]}" \
            --log-opts="${base_sha}..${head_sha}"

      - name: Scan (push)
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          config_args=()
          if [ -f "gitleaks.toml" ]; then
            config_args+=(--config="gitleaks.toml")
          fi

          if [ "${{ github.event.before }}" = "0000000000000000000000000000000000000000" ]; then
            gitleaks detect \
              --no-banner \
              --redact \
              "${config_args[@]}" \
              --no-git
            exit 0
          fi

          gitleaks detect \
            --no-banner \
            --redact \
            "${config_args[@]}" \
            --log-opts="${{ github.event.before }}..${{ github.sha }}"

      - name: Scan (workflow_dispatch)
        if: github.event_name == 'workflow_dispatch'
        run: |
          set -euo pipefail
          config_args=()
          if [ -f "gitleaks.toml" ]; then
            config_args+=(--config="gitleaks.toml")
          fi

          gitleaks detect \
            --no-banner \
            --redact \
            "${config_args[@]}" \
            --no-git
