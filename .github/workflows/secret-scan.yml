name: Secret Scan

on:
  pull_request:
    branches: [ main, staged, dev ]
  push:
    branches: [ main, staged, dev ]

permissions:
  contents: read

jobs:
  gitleaks:
    name: Secret Scan (gitleaks)
    runs-on: ubuntu-latest
    env:
      GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install gitleaks CLI
        run: |
          VERSION="8.24.2"
          ARCH="$(uname -m)"
          case "$ARCH" in
            x86_64|amd64) TARGET_ARCH="x64" ;;
            aarch64|arm64) TARGET_ARCH="arm64" ;;
            *)
              echo "Unsupported architecture: $ARCH"
              exit 1
              ;;
          esac

          ARCHIVE="gitleaks_${VERSION}_linux_${TARGET_ARCH}.tar.gz"
          INSTALL_DIR="$RUNNER_TEMP/gitleaks-bin"
          mkdir -p "$INSTALL_DIR"
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/${ARCHIVE}" -o "$RUNNER_TEMP/$ARCHIVE"
          tar -xzf "$RUNNER_TEMP/$ARCHIVE" -C "$INSTALL_DIR" gitleaks
          chmod +x "$INSTALL_DIR/gitleaks"
          echo "$INSTALL_DIR" >> "$GITHUB_PATH"

      - name: Scan
        run: |
          RANGE=""

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            RANGE="${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
          elif [ "${{ github.event_name }}" = "push" ] && [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            RANGE="${{ github.event.before }}..${{ github.sha }}"
          fi

          if [ -n "$RANGE" ]; then
            echo "Scanning git range: $RANGE"
            gitleaks git . --redact --no-banner --log-opts="$RANGE"
          else
            echo "No commit range available; scanning current checkout history."
            gitleaks git . --redact --no-banner
          fi
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Install gitleaks OSS binary
        if: ${{ env.GITLEAKS_LICENSE == '' }}
        env:
          GITLEAKS_VERSION: '8.24.2'
        run: |-
          set -euo pipefail
          arch="$(uname -m)"
          case "${arch}" in
            x86_64 | amd64)
              artifact_arch='x64'
              ;;
            aarch64 | arm64)
              artifact_arch='arm64'
              ;;
            *)
              echo "::error::Unsupported runner architecture: ${arch}"
              exit 1
              ;;
          esac

          echo '::notice::GITLEAKS_LICENSE is not configured. Running gitleaks OSS fallback.'
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_${artifact_arch}.tar.gz" \
            | tar -xz gitleaks
          install_dir="${RUNNER_TEMP}/gitleaks-bin"
          mkdir -p "${install_dir}"
          install -m 0755 gitleaks "${install_dir}/gitleaks"
          echo "${install_dir}" >> "${GITHUB_PATH}"
          "${install_dir}/gitleaks" version

      - name: Scan (OSS fallback)
        if: ${{ env.GITLEAKS_LICENSE == '' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |-
          set -euo pipefail
          gitleaks git --redact --verbose .
