name: Secret Scan

on:
  pull_request:
    branches: [ main, staged, dev ]
  push:
    branches: [ main, staged, dev ]

permissions:
  contents: read

jobs:
  gitleaks:
    name: Secret Scan (gitleaks)
    runs-on: ubuntu-latest
    env:
      GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan (licensed)
        if: ${{ env.GITLEAKS_LICENSE != '' }}
        uses: gitleaks/gitleaks-action@v1
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Install gitleaks OSS binary
        if: ${{ env.GITLEAKS_LICENSE == '' }}
        env:
          GITLEAKS_VERSION: '8.24.2'
        run: |-
          set -euo pipefail
          arch="$(uname -m)"
          case "${arch}" in
            x86_64 | amd64)
              artifact_arch='x64'
              ;;
            aarch64 | arm64)
              artifact_arch='arm64'
              ;;
            *)
              echo "::error::Unsupported runner architecture: ${arch}"
              exit 1
              ;;
          esac

          echo '::notice::GITLEAKS_LICENSE is not configured. Running gitleaks OSS fallback.'
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_${artifact_arch}.tar.gz" \
            | tar -xz gitleaks
          install_dir="${RUNNER_TEMP}/gitleaks-bin"
          mkdir -p "${install_dir}"
          install -m 0755 gitleaks "${install_dir}/gitleaks"
          echo "${install_dir}" >> "${GITHUB_PATH}"
          "${install_dir}/gitleaks" version

      - name: Scan (OSS fallback)
        if: ${{ env.GITLEAKS_LICENSE == '' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |-
          set -euo pipefail
          gitleaks git --redact --verbose .
