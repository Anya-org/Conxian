name: Secret Scan

on:
  pull_request:
    branches: [ main, staged, dev ]
  push:
    branches: [ main, staged, dev ]

permissions:
  contents: read

jobs:
  gitleaks:
    name: Secret Scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install gitleaks CLI
        run: |
          VERSION="8.24.2"
          ARCH="$(uname -m)"
          case "$ARCH" in
            x86_64|amd64) TARGET_ARCH="x64" ;;
            aarch64|arm64) TARGET_ARCH="arm64" ;;
            *)
              echo "Unsupported architecture: $ARCH"
              exit 1
              ;;
          esac

          ARCHIVE="gitleaks_${VERSION}_linux_${TARGET_ARCH}.tar.gz"
          INSTALL_DIR="$RUNNER_TEMP/gitleaks-bin"
          mkdir -p "$INSTALL_DIR"
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/${ARCHIVE}" -o "$RUNNER_TEMP/$ARCHIVE"
          tar -xzf "$RUNNER_TEMP/$ARCHIVE" -C "$INSTALL_DIR" gitleaks
          chmod +x "$INSTALL_DIR/gitleaks"
          echo "$INSTALL_DIR" >> "$GITHUB_PATH"

      - name: Scan
        run: |
          RANGE=""

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            RANGE="${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
          elif [ "${{ github.event_name }}" = "push" ] && [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            RANGE="${{ github.event.before }}..${{ github.sha }}"
          fi

          if [ -n "$RANGE" ]; then
            echo "Scanning git range: $RANGE"
            gitleaks git . --redact --no-banner --log-opts="$RANGE"
          else
            echo "No commit range available; scanning current checkout history."
            gitleaks git . --redact --no-banner
          fi
        env:
          GITHUB_TOKEN: ${{ github.token }}
