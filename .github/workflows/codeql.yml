name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 0 * * 0"

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript]

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Initialize CodeQL
        uses: github/codeql-action/init@dd903d2d3a44e283e92f8a7e5c61556db4bc1f5c
        with:
          languages: ${{ matrix.language }}

      - name: Autobuild
        uses: github/codeql-action/autobuild@dd903d2d3a44e283e92f8a7e5c61556db4bc1f5c

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@dd903d2d3a44e283e92f8a7e5c61556db4bc1f5c
