name: Documentation Validation

on:
  push:
    branches: [main]
    paths:
      - '**.md'
      - 'docs/**'
      - 'AGENTS.md'
      - 'contracts/**/*.clar'
      - 'tests/**/*.test.ts'
      - 'tests/**/*.spec.ts'
      - 'Clarinet.toml'
      - 'deployments/full-system.*-plan.yaml'
      - 'scripts/validate-docs.js'
      - 'scripts/verify-knowledge-base.py'
      - 'tests/validate-docs.test.js'
      - 'tests/test_verify_knowledge_base.py'
      - 'package.json'
  pull_request:
    paths:
      - '**.md'
      - 'docs/**'
      - 'AGENTS.md'
      - 'contracts/**/*.clar'
      - 'tests/**/*.test.ts'
      - 'tests/**/*.spec.ts'
      - 'Clarinet.toml'
      - 'deployments/full-system.*-plan.yaml'
      - 'scripts/validate-docs.js'
      - 'scripts/verify-knowledge-base.py'
      - 'tests/validate-docs.test.js'
      - 'tests/test_verify_knowledge_base.py'
      - 'package.json'

permissions:
  contents: read

jobs:
  docs-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          fetch-depth: 0

      - name: Install knowledge-base validator dependency
        run: python3 -m pip install --user --disable-pip-version-check 'PyYAML==6.0.2'

      - name: Test local documentation validators
        run: |
          npm run test:docs-validation
          npm run test:knowledge-base

      - name: Validate local documentation and knowledge base
        run: |
          npm run validate:docs
          npm run verify:knowledge-base

      - name: Validate external Markdown links
        uses: gaurav-nelson/github-action-markdown-link-check@5c5dfc0ac2e225883c0e5f03a85311ec2830d368 # v1
        with:
          use-quiet-mode: yes
          folder-path: 'docs'

      - name: Check Documentation Freshness
        run: |
          # Check if docs were updated in last 30 days
          DOCS_AGE=$(git log --after="$(date -d '30 days ago' +%Y-%m-%d)" --name-only --pretty=format: docs/ | wc -l)
          echo "Documents updated in last 30 days: $DOCS_AGE"
          
          # Verify AGENTS.md has current date
          AGENTS_DATE=$(git log -1 --format="%ai" -- AGENTS.md)
          echo "AGENTS.md last updated: $AGENTS_DATE"

      - name: Validate Required Files
        run: |
          REQUIRED_FILES=(
            "README.md"
            "CONTRIBUTING.md"
            "SECURITY.md"
            "AGENTS.md"
            "docs/index.md"
            "docs/DOCUMENTATION_STATE.md"
          )
          
          for file in "${REQUIRED_FILES[@]}"; do
            if [ ! -f "$file" ]; then
              echo "MISSING: $file"
              exit 1
            fi
            echo "FOUND: $file"
          done

  session-state-validate:
    needs: docs-validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - name: Validate DOCUMENTATION_STATE.md
        run: |
          if [ ! -s "docs/DOCUMENTATION_STATE.md" ]; then
            echo "MISSING OR EMPTY: docs/DOCUMENTATION_STATE.md"
            exit 1
          fi

          LAST_STATUS=$(grep -m1 -o '"status": "[^"]*"' docs/DOCUMENTATION_STATE.md || true)
          if [ -z "$LAST_STATUS" ]; then
            echo "docs/DOCUMENTATION_STATE.md does not report a session status"
            exit 1
          fi

          echo "Session state file is present; reported status: $LAST_STATUS"
