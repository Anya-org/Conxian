# Dependabot configuration for GitHub Actions and ecosystem management
# Enforces automated security and version updates for standard workspace integrations

version: 2
updates:
  # Maintain dependencies for GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "dev"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "dependencies"
      - "ci-cd"
    assignees:
      - "botshelomokoka"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"

  # Maintain Docker dependencies if any Dockerfiles exist in the root
  - package-ecosystem: "docker"
    directory: "/"
    target-branch: "dev"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "dependencies"
      - "docker"
    assignees:
      - "botshelomokoka"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"

  # Maintain npm dependencies for repository-owned JavaScript workspaces
  - package-ecosystem: "npm"
    directory: "/"
    target-branch: "dev"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "dependencies"
      - "npm"
    assignees:
      - "botshelomokoka"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"

  - package-ecosystem: "npm"
    directory: "/showcase-dapp"
    target-branch: "dev"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "dependencies"
      - "npm"
    assignees:
      - "botshelomokoka"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"

  # Maintain cargo dependencies for repository-owned Rust workspace manifests
  - package-ecosystem: "cargo"
    directory: "/"
    target-branch: "dev"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "dependencies"
      - "rust"
    assignees:
      - "botshelomokoka"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
