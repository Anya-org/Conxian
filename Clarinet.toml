[project]
name = "Conxian-Root"
clarinet_version = "3.13.1"
epoch = "3.0"

[simnet]
mnemonic = "cute bird surprise boring old news cake design aisle helmet choose tree"

[contracts.sip-standards]
path = "contracts/traits/sip-standards.clar"
