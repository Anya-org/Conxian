name: Conxian Protocol Mainnet Manifest v1.0.0
network: mainnet
deployer: ST1BK6TFDEJ4TBVWH5SHNB6SPNWGY06YZFG9WMM4P

batches:
  - id: 0
    description: "Core Traits and SIP Standards"
    transactions:
      - contract-publish:
          contract-name: sip-standards
          path: "contracts/traits/sip-standards.clar"
      - contract-publish:
          contract-name: core-traits
          path: "contracts/traits/core-traits.clar"
      - contract-publish:
          contract-name: defi-traits
          path: "contracts/traits/defi-traits.clar"
      - contract-publish:
          contract-name: governance-traits
          path: "contracts/traits/governance-traits.clar"
      - contract-publish:
          contract-name: conxian-csf-trait
          path: "contracts/traits/conxian-csf-trait.clar"

  - id: 1
    description: "Protocol Identity and Access"
    transactions:
      - contract-publish:
          contract-name: conxian-protocol
          path: "contracts/core/conxian-protocol.clar"
      - contract-publish:
          contract-name: conxian-access
          path: "contracts/core/conxian-access.clar"

  - id: 2
    description: "Financial Infrastructure"
    transactions:
      - contract-publish:
          contract-name: operational-treasury
          path: "contracts/core/operational-treasury.clar"
      - contract-publish:
          contract-name: cxd-token
          path: "contracts/tokens/cxd-token.clar"
      - contract-publish:
          contract-name: bme-engine
          path: "contracts/core/bme-engine.clar"

  - id: 3
    description: "DEX and Lending Engines"
    transactions:
      - contract-publish:
          contract-name: pool-factory
          path: "contracts/pools/pool-factory.clar"
      - contract-publish:
          contract-name: swap-router
          path: "contracts/dex/swap-router.clar"
      - contract-publish:
          contract-name: lending-manager
          path: "contracts/lending/lending-manager.clar"

  - id: 4
    description: "Risk and Monitoring"
    transactions:
      - contract-publish:
          contract-name: finance-metrics
          path: "contracts/monitoring/finance-metrics.clar"
      - contract-publish:
          contract-name: agent-risk
          path: "contracts/agents/agent-risk.clar"
      - contract-publish:
          contract-name: enhanced-circuit-breaker
          path: "contracts/security/enhanced-circuit-breaker.clar"

  - id: 5
    description: "System Wiring"
    transactions:
      - contract-call:
          contract-id: "ST1BK6TFDEJ4TBVWH5SHNB6SPNWGY06YZFG9WMM4P.conxian-protocol"
          method: "initialize"
          parameters: ["'ST1BK6TFDEJ4TBVWH5SHNB6SPNWGY06YZFG9WMM4P"]
      - contract-call:
          contract-id: "ST1BK6TFDEJ4TBVWH5SHNB6SPNWGY06YZFG9WMM4P.operational-treasury"
          method: "initialize"
          parameters: ["'ST1BK6TFDEJ4TBVWH5SHNB6SPNWGY06YZFG9WMM4P"]
