    transactions:
      - contract-publish:
          contract-name: cxlp-token
          path: contracts/tokens/cxlp-token.clar
      - contract-publish:
          contract-name: cxvg-token
          path: contracts/tokens/cxvg-token.clar
      - contract-publish:
          contract-name: token-system-coordinator
          path: contracts/tokens/token-system-coordinator.clar
      - contract-publish:
          contract-name: bridge-nft
          path: contracts/cross-chain/bridge-nft.clar
      - contract-publish:
          contract-name: proposal-engine
          path: contracts/governance/proposal-engine.clar
      - contract-publish:
          contract-name: proposal-executor
          path: contracts/governance/proposal-executor.clar
      - contract-publish:
          contract-name: enhanced-governance-nft
          path: contracts/governance/enhanced-governance-nft.clar

  # --- Phase 8: System Wiring & Initialization ---
  - id: 8
    description: "Protocol Initialization and Role Configuration"
    transactions:
      - contract-call:
          contract-id: "ST1BK6TFDEJ4TBVWH5SHNB6SPNWGY06YZFG9WMM4P.conxian-protocol"
          method: "set-owner"
          parameters: ["'ST1BK6TFDEJ4TBVWH5SHNB6SPNWGY06YZFG9WMM4P"]
      - contract-call:
          contract-id: "ST1BK6TFDEJ4TBVWH5SHNB6SPNWGY06YZFG9WMM4P.operational-treasury"
          method: "initialize"
          parameters: ["'ST1BK6TFDEJ4TBVWH5SHNB6SPNWGY06YZFG9WMM4P"]
      - contract-call:
          contract-id: "ST1BK6TFDEJ4TBVWH5SHNB6SPNWGY06YZFG9WMM4P.cxd-token"
          method: "add-minter"
          parameters: ["'ST1BK6TFDEJ4TBVWH5SHNB6SPNWGY06YZFG9WMM4P.bme-engine"]
      - contract-call:
          contract-id: "ST1BK6TFDEJ4TBVWH5SHNB6SPNWGY06YZFG9WMM4P.cxd-token"
          method: "add-burner"
          parameters: ["'ST1BK6TFDEJ4TBVWH5SHNB6SPNWGY06YZFG9WMM4P.bme-engine"]
      - contract-call:
          contract-id: "ST1BK6TFDEJ4TBVWH5SHNB6SPNWGY06YZFG9WMM4P.bme-engine"
          method: "add-activity-reporter"
          parameters: ["'ST1BK6TFDEJ4TBVWH5SHNB6SPNWGY06YZFG9WMM4P.swap-router"]
      - contract-call:
          contract-id: "ST1BK6TFDEJ4TBVWH5SHNB6SPNWGY06YZFG9WMM4P.bme-engine"
          method: "add-activity-reporter"
          parameters: ["'ST1BK6TFDEJ4TBVWH5SHNB6SPNWGY06YZFG9WMM4P.lending-manager"]
      - contract-call:
          contract-id: "ST1BK6TFDEJ4TBVWH5SHNB6SPNWGY06YZFG9WMM4P.risk-unit"
          method: "initialize"
          parameters:
            - "'ST1BK6TFDEJ4TBVWH5SHNB6SPNWGY06YZFG9WMM4P"
            - "'ST1BK6TFDEJ4TBVWH5SHNB6SPNWGY06YZFG9WMM4P.agent-risk"
            - "'ST1BK6TFDEJ4TBVWH5SHNB6SPNWGY06YZFG9WMM4P.dimensional-engine"
      - contract-call:
          contract-id: "ST1BK6TFDEJ4TBVWH5SHNB6SPNWGY06YZFG9WMM4P.risk-unit"
          method: "set-ops-engine"
          parameters: ["'ST1BK6TFDEJ4TBVWH5SHNB6SPNWGY06YZFG9WMM4P.ops-engine"]
