name: Conxian Protocol Mainnet Manifest v2.0.0 (Apex CSF v1.1.0)
network: mainnet
stacks-node: "https://api.mainnet.hiro.so"
deployer: ST1BK6TFDEJ4TBVWH5SHNB6SPNWGY06YZFG9WMM4P

batches:
  # --- Phase 0: Traits & Standards (zero deps) ---
  - id: 0
    description: "Core Traits and SIP Standards"
    transactions:
      - contract-publish:
          contract-name: sip-standards
          path: contracts/traits/sip-standards.clar
      - contract-publish:
          contract-name: core-traits
          path: contracts/traits/core-traits.clar
      - contract-publish:
          contract-name: defi-traits
          path: contracts/traits/defi-traits.clar
      - contract-publish:
          contract-name: governance-traits
          path: contracts/traits/governance-traits.clar
      - contract-publish:
          contract-name: conxian-csf-trait
          path: contracts/traits/conxian-csf-trait.clar
      - contract-publish:
          contract-name: security-monitoring
          path: contracts/traits/security-monitoring.clar
      - contract-publish:
          contract-name: automation-traits
          path: contracts/traits/automation-traits.clar
      - contract-publish:
          contract-name: access-control-trait
          path: contracts/traits/access-control-trait.clar

  # --- Phase 1: Identity, Access & Compliance ---
  - id: 1
    description: "Protocol Registry, Access Control, KYC, Compliance"
    transactions:
      - contract-publish:
          contract-name: conxian-protocol
          path: contracts/core/conxian-protocol.clar
      - contract-publish:
          contract-name: conxian-access
          path: contracts/core/conxian-access.clar
      - contract-publish:
          contract-name: kyc-registry
          path: contracts/identity/kyc-registry.clar
      - contract-publish:
          contract-name: regulatory-adapter
          path: contracts/compliance/regulatory-adapter.clar
      - contract-publish:
          contract-name: block-utils
          path: contracts/utils/block-utils.clar

  # --- Phase 2: Financial Core ---
  - id: 2
    description: "Tokens, Treasury, Oracle, BME Engine"
    transactions:
      - contract-publish:
          contract-name: cxd-token
          path: contracts/tokens/cxd-token.clar
      - contract-publish:
          contract-name: operational-treasury
          path: contracts/core/operational-treasury.clar
      - contract-publish:
          contract-name: federated-oracle-adapter
          path: contracts/oracle/federated-oracle-adapter.clar
      - contract-publish:
          contract-name: oracle-aggregator
          path: contracts/oracle/oracle-aggregator.clar
      - contract-publish:
          contract-name: finance-metrics
          path: contracts/monitoring/finance-metrics.clar
      - contract-publish:
          contract-name: bme-engine
          path: contracts/core/bme-engine.clar
      - contract-publish:
          contract-name: revenue-distributor
          path: contracts/treasury/revenue-distributor.clar
      - contract-publish:
          contract-name: revenue-automation
          path: contracts/treasury/revenue-automation.clar

  # --- Phase 3: Security Infrastructure ---
  - id: 3
    description: "Circuit Breakers, Proof of Reserves, Rate Limiter"
    transactions:
      - contract-publish:
          contract-name: enhanced-circuit-breaker
          path: contracts/security/enhanced-circuit-breaker.clar
      - contract-publish:
          contract-name: circuit-breaker
          path: contracts/security/circuit-breaker.clar
      - contract-publish:
          contract-name: proof-of-reserves
          path: contracts/security/proof-of-reserves.clar
      - contract-publish:
          contract-name: conxian-insurance-fund
          path: contracts/security/conxian-insurance-fund.clar
