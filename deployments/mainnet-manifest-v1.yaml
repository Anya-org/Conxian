  - id: 4
    description: "Concentrated Liquidity, Swap Router, DEX Infrastructure"
    transactions:
      - contract-publish:
          contract-name: concentrated-math
          path: contracts/math/concentrated-math.clar
      - contract-publish:
          contract-name: concentrated-liquidity-pool
          path: contracts/dex/concentrated-liquidity-pool.clar
      - contract-publish:
          contract-name: swap-router
          path: contracts/dex/swap-router.clar
      - contract-publish:
          contract-name: swap-manager
          path: contracts/dex/swap-manager.clar
      - contract-publish:
          contract-name: route-manager
          path: contracts/dex/route-manager.clar
      - contract-publish:
          contract-name: pool-factory
